<title>SPI非言語 問題集</title>

<style>
  :root {
    --bg:        #EDF0F5;
    --surface:   #FFFFFF;
    --surface-2: #F5F7FA;
    --ink:       #16233C;
    --ink-2:     #5A6885;
    --ink-3:     #8A97AF;
    --line:      #D2DAE6;
    --line-soft: #E3E9F1;
    --accent:    #22376F;
    --accent-2:  #3D5FA8;
    --accent-bg: #E5EAF5;
    --ok:        #1B7A5A;
    --ok-bg:     #E3F1EB;
    --ng:        #B23A2E;
    --ng-bg:     #F7E5E2;
    --na:        #8A6A16;
    --na-bg:     #F5EDD9;
    --grid:      rgba(34, 55, 111, .07);
    --on-accent: #FFFFFF;
    --scrim:     rgba(15, 23, 40, .48);
    --shadow:    0 1px 2px rgba(22, 35, 60, .05), 0 8px 24px -16px rgba(22, 35, 60, .35);

    --mincho: "Hiragino Mincho ProN", "HiraMinProN-W3", "Yu Mincho", YuMincho, "Noto Serif JP", "Songti SC", serif;
    --gothic: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
    --mono:   ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0E1420;
      --surface:   #161E2C;
      --surface-2: #1C2536;
      --ink:       #E5EAF3;
      --ink-2:     #9AA6BC;
      --ink-3:     #6E7C95;
      --line:      #2B3549;
      --line-soft: #222C3D;
      --accent:    #8FAEE8;
      --accent-2:  #A8C0EF;
      --accent-bg: #1E2A42;
      --ok:        #4FBF95;
      --ok-bg:     #122C25;
      --ng:        #E4816F;
      --ng-bg:     #2E1A17;
      --na:        #D9B75C;
      --na-bg:     #2B2413;
      --grid:      rgba(143, 174, 232, .08);
      --on-accent: #0E1420;
      --scrim:     rgba(0, 0, 0, .62);
      --shadow:    0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }

  :root[data-theme="light"] {
    --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA;
    --ink:#16233C; --ink-2:#5A6885; --ink-3:#8A97AF;
    --line:#D2DAE6; --line-soft:#E3E9F1;
    --accent:#22376F; --accent-2:#3D5FA8; --accent-bg:#E5EAF5;
    --ok:#1B7A5A; --ok-bg:#E3F1EB; --ng:#B23A2E; --ng-bg:#F7E5E2;
    --na:#8A6A16; --na-bg:#F5EDD9;
    --grid:rgba(34,55,111,.07); --on-accent:#FFFFFF; --scrim:rgba(15,23,40,.48);
    --shadow:0 1px 2px rgba(22,35,60,.05), 0 8px 24px -16px rgba(22,35,60,.35);
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg:#0E1420; --surface:#161E2C; --surface-2:#1C2536;
    --ink:#E5EAF3; --ink-2:#9AA6BC; --ink-3:#6E7C95;
    --line:#2B3549; --line-soft:#222C3D;
    --accent:#8FAEE8; --accent-2:#A8C0EF; --accent-bg:#1E2A42;
    --ok:#4FBF95; --ok-bg:#122C25; --ng:#E4816F; --ng-bg:#2E1A17;
    --na:#D9B75C; --na-bg:#2B2413;
    --grid:rgba(143,174,232,.08); --on-accent:#0E1420; --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--gothic);
    font-size: 16px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 42rem;
    margin: 0 auto;
    padding: 0 1rem 7rem;
  }

  /* ── 上部バー ───────────────────────────── */
  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 0 -1rem;
    padding: .55rem 1rem .45rem;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
  }
  .bar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
  }
  .bar-title {
    font-family: var(--mincho);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: .06em;
    margin: 0;
  }
  .bar-meta {
    display: flex;
    align-items: center;
    gap: .9rem;
    font-family: var(--mono);
    font-size: .78rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .bar-meta b { color: var(--ink); font-weight: 600; }
  .rule {
    height: 3px;
    margin-top: .45rem;
    background: var(--line-soft);
    border-radius: 2px;
    overflow: hidden;
  }
  .rule span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .3s ease;
  }
  @media (prefers-reduced-motion: reduce) { .rule span { transition: none; } }

  .timer { margin-top: .3rem; height: 4px; }
  .timer span { transition: none; background: var(--accent-2); }
  .timer span.warn { background: var(--na); }
  .timer span.crit { background: var(--ng); }
  .clock { font-variant-numeric: tabular-nums; }
  .clock.warn { color: var(--na); }
  .clock.crit { color: var(--ng); font-weight: 700; }

  .flag {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .1em;
    color: var(--na);
    background: var(--na-bg);
    border-radius: 4px;
    padding: .1rem .4rem;
  }

  /* 直近3回の正否 */
  .hist { display: inline-flex; align-items: center; gap: .28rem; }
  .hist .hist-label {
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .12em;
    color: var(--ink-3);
    margin-right: .15rem;
  }
  .hist i {
    width: 9px; height: 9px;
    border-radius: 50%;
    display: block;
    border: 1px solid var(--line);
  }
  .hist i.o { background: var(--ok); border-color: var(--ok); }
  .hist i.x { background: var(--ng); border-color: var(--ng); }
  .hist i.u { background: var(--na); border-color: var(--na); }
  .hist i.none { background: transparent; }
  .verdict-head .hist { margin-left: auto; }
  /* 判定バーは正誤で色がつくので、ドットに地色のふちをつけて分離する */
  .verdict-head .hist i { box-shadow: 0 0 0 1.5px var(--surface); }
  .verdict-head .hist .hist-label { color: currentColor; opacity: .7; }
  .review-item .hist { margin-top: .35rem; }

  .theme-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
    padding: 0;
  }
  .theme-btn svg { width: 15px; height: 15px; display: block; }

  /* ── 共通パーツ ─────────────────────────── */
  .eyebrow {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 .35rem;
  }
  h2.head {
    font-family: var(--mincho);
    font-size: 1.45rem;
    line-height: 1.45;
    font-weight: 600;
    letter-spacing: .02em;
    margin: 0 0 .3rem;
    text-wrap: balance;
  }
  .lede { color: var(--ink-2); font-size: .92rem; margin: 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.1rem;
    box-shadow: var(--shadow);
  }

  section.block { margin-top: 1.5rem; }
  .block-label {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .14em;
    color: var(--ink-3);
    margin: 0 0 .55rem;
    display: flex;
    align-items: baseline;
    gap: .6rem;
  }
  .block-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line-soft);
  }

  .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip {
    font-family: inherit;
    font-size: .85rem;
    padding: .5rem .8rem;
    min-height: 40px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: .45rem;
  }
  .chip .n {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .chip[aria-pressed="true"] .n { color: var(--accent); }

  .seg { display: flex; gap: .5rem; }
  .seg .chip { flex: 1; justify-content: center; }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    min-height: 52px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
    letter-spacing: .04em;
  }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.ghost {
    background: var(--surface);
    color: var(--ink-2);
    border-color: var(--line);
    font-weight: 500;
  }

  :focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  /* ── 学習記録 ───────────────────────────── */
  .stat-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .5rem;
    padding: .45rem 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: .88rem;
  }
  .stat-row:last-child { border-bottom: 0; }
  .stat-row .name { flex: none; width: 7.4em; font-size: .84rem; color: var(--ink-2); }
  .meter {
    flex: 1;
    height: 6px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .meter span.low { background: var(--ng); }
  .meter span.mid { background: var(--accent-2); }
  .stat-row .val {
    font-family: var(--mono);
    font-size: .8rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    flex: none;
    width: 5.2em;
    text-align: right;
  }
  .summary-big {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .summary-big .pct { font-size: 2.6rem; font-weight: 600; letter-spacing: -.02em; }
  .summary-big .sub { font-size: .8rem; color: var(--ink-2); }

  /* ── 問題 ───────────────────────────────── */
  .qtag {
    display: inline-block;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .1em;
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: 4px;
    padding: .15rem .5rem;
    margin-bottom: .7rem;
  }
  .qcard {
    background:
      repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(to right,  var(--grid) 0 1px, transparent 1px 22px),
      var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.1rem;
    box-shadow: var(--shadow);
  }
  .qtext { font-size: 1.02rem; line-height: 1.85; margin: 0; }
  .qtext ul { margin: .7rem 0 0; padding-left: 1.2rem; }
  .qtext li { margin: .2rem 0; }
  .table-wrap { overflow-x: auto; margin-top: .9rem; }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 20rem;
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
    background: var(--surface);
  }
  caption {
    caption-side: top;
    text-align: left;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .1em;
    color: var(--ink-3);
    padding-bottom: .35rem;
  }
  th, td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: right; }
  th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); }
  th:first-child, td:first-child { text-align: left; }

  .choices { display: flex; flex-direction: column; gap: .55rem; margin-top: 1rem; }
  .choice {
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-height: 52px;
    padding: .6rem .8rem;
    text-align: left;
    font-family: inherit;
    font-size: .97rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .choice .key {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--ink-2);
  }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
  .choice[aria-pressed="true"] .key { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }

  .choice.is-ok { border-color: var(--ok); background: var(--ok-bg); }
  .choice.is-ok .key { border-color: var(--ok); background: var(--ok); color: var(--on-accent); }
  .choice.is-ng { border-color: var(--ng); background: var(--ng-bg); }
  .choice.is-ng .key { border-color: var(--ng); background: var(--ng); color: var(--on-accent); }
  .choice[disabled] { cursor: default; }
  .choice .mark { margin-left: auto; font-size: 1.1rem; flex: none; }
  .choice.is-ok .mark { color: var(--ok); }
  .choice.is-ng .mark { color: var(--ng); }
  .choice.is-na .mark { color: var(--na); }

  .choice.unknown {
    margin-top: .35rem;
    border-style: dashed;
    color: var(--ink-2);
    font-size: .92rem;
    min-height: 48px;
  }
  .choice.unknown .key { font-size: .9rem; }
  .choice.unknown[aria-pressed="true"] {
    border-style: solid;
    border-color: var(--na);
    background: var(--na-bg);
    color: var(--na);
  }
  .choice.unknown[aria-pressed="true"] .key { border-color: var(--na); background: var(--na); color: var(--on-accent); }
  .choice.unknown.is-na { border-style: solid; border-color: var(--na); background: var(--na-bg); color: var(--na); }
  .choice.unknown.is-na .key { border-color: var(--na); background: var(--na); color: var(--on-accent); }

  /* ── メモ ───────────────────────────────── */
  details.memo { margin-top: .9rem; }
  details.memo summary {
    font-family: var(--mono);
    font-size: .75rem;
    letter-spacing: .1em;
    color: var(--ink-3);
    cursor: pointer;
    padding: .35rem 0;
    list-style: none;
  }
  details.memo summary::-webkit-details-marker { display: none; }
  details.memo summary::before { content: "＋ "; }
  details.memo[open] summary::before { content: "− "; }
  textarea.pad {
    width: 100%;
    min-height: 7rem;
    padding: .6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: .9rem;
    line-height: 22px;
    resize: vertical;
    background:
      repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(to right,  var(--grid) 0 1px, transparent 1px 22px),
      var(--surface-2);
  }

  /* ── 解説 ───────────────────────────────── */
  .verdict {
    margin-top: 1rem;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    overflow: hidden;
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .verdict { animation: none; } }
  .verdict-head {
    display: flex;
    align-items: center;
    gap: .55rem;
    padding: .6rem .9rem;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .verdict.ok  .verdict-head { background: var(--ok-bg); color: var(--ok); }
  .verdict.ng  .verdict-head { background: var(--ng-bg); color: var(--ng); }
  .verdict.na  .verdict-head { background: var(--na-bg); color: var(--na); }
  .verdict-body { padding: .85rem .9rem 1rem; }
  .verdict-body .exp-label {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .16em;
    color: var(--ink-3);
    display: block;
    margin-bottom: .35rem;
  }
  .verdict-body p { margin: 0; font-size: .93rem; line-height: 1.85; }
  .calc {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    background: var(--surface-2);
    border-left: 2px solid var(--accent);
    padding: .5rem .7rem;
    margin-top: .7rem;
    font-size: .85rem;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre-wrap;
  }

  /* ── 下部固定バー ───────────────────────── */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line-soft);
  }
  .dock-inner { max-width: 42rem; margin: 0 auto; display: flex; gap: .6rem; }
  .dock .btn { flex: 1; }
  .dock .btn.ghost { flex: 0 0 5.5rem; }

  .hidden { display: none !important; }

  /* ── 確認シート ─────────────────────────
     掲載先の iframe は sandbox 下で confirm() が無視されるため、
     ネイティブダイアログではなくページ内で確認する。 */
  .sheet { position: fixed; inset: 0; z-index: 60; }
  .sheet-back { position: absolute; inset: 0; background: var(--scrim); }
  .sheet-card {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-width: 42rem;
    margin: 0 auto;
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 1.2rem 1rem calc(1.1rem + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 32px -12px rgba(0, 0, 0, .45);
    animation: sheet-up .2s ease-out;
  }
  @keyframes sheet-up { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet-card { animation: none; } }
  .sheet-title {
    font-family: var(--mincho);
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 .35rem;
  }
  .sheet-msg { margin: 0 0 1.1rem; font-size: .9rem; color: var(--ink-2); }
  .sheet-actions { display: flex; gap: .6rem; }
  .sheet-actions .btn { flex: 1; }
  .btn.danger { background: var(--ng); border-color: var(--ng); color: var(--on-accent); }

  /* ── 結果 ───────────────────────────────── */
  .result-hero {
    text-align: center;
    padding: 1.6rem 1rem 1.4rem;
  }
  .result-hero .score {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 3.4rem;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.03em;
  }
  .result-hero .score small { font-size: 1.2rem; color: var(--ink-3); font-weight: 400; }
  .result-hero .comment {
    font-family: var(--mincho);
    font-size: 1.05rem;
    margin: .8rem 0 0;
    color: var(--ink-2);
  }
  .review-item {
    border-top: 1px solid var(--line-soft);
    padding: .8rem 0;
    font-size: .9rem;
  }
  .review-item:first-child { border-top: 0; }
  .review-item .rq { margin: .2rem 0 .4rem; color: var(--ink); }
  .review-item .ra { font-size: .85rem; color: var(--ink-2); }
  .review-item .ra b { color: var(--ok); }
  .review-item .ra em { font-style: normal; color: var(--na); }
  .review-item details { margin-top: .5rem; }
  .review-item summary {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .1em;
    color: var(--ink-3);
    cursor: pointer;
    list-style: none;
    padding: .25rem 0;
  }
  .review-item summary::-webkit-details-marker { display: none; }
  .review-item summary::before { content: "＋ "; }
  .review-item details[open] summary::before { content: "− "; }
  .review-item .exp { font-size: .87rem; color: var(--ink-2); margin: 0; }

  .badge {
    display: inline-grid;
    place-items: center;
    width: 20px; height: 20px;

<script>
(function () {
  "use strict";

  /* ══ 分野 ══════════════════════════════════════════ */
  const CATS = [
    ["suiron",   "推論"],
    ["baai",     "場合の数"],
    ["kakuritsu","確率"],
    ["wariai",   "割合と比"],
    ["soneki",   "損益算"],
    ["shigoto",  "仕事算"],
    ["hayasa",   "速さ"],
    ["shugo",    "集合"],
    ["hyou",     "表の読み取り"],
    ["waribiki", "料金の割引"],
    ["bunkatsu", "分割払い・精算"],
    ["noudo",    "濃度算"],
    ["nenrei",   "年齢算"],
    ["ueki",     "植木算"],
    ["tsurukame","鶴亀算"],
    ["nshin",    "n進法"]
  ];
  const CAT_NAME = Object.fromEntries(CATS);

  const SALES_TABLE = `
    <div class="table-wrap"><table>
      <caption>4店舗の年間売上（単位：万円）</caption>
      <thead><tr><th>店舗</th><th>2023年</th><th>2024年</th></tr></thead>
      <tbody>
        <tr><td>A店</td><td>1,200</td><td>1,380</td></tr>
        <tr><td>B店</td><td>900</td><td>810</td></tr>
        <tr><td>C店</td><td>1,500</td><td>1,650</td></tr>
        <tr><td>D店</td><td>600</td><td>690</td></tr>
      </tbody>
    </table></div>`;

  /* ══ 問題データ ════════════════════════════════════ */
  const Q = [
    /* ── 推論 ─────────────────────────────── */
    { id:"su1", cat:"suiron",
      q:`P、Q、R、S、Tの5人が1列に並んでいる。次のことがわかっているとき、確実にいえるものはどれか。
        <ul><li>PはQの2つ前にいる</li><li>RはSより後ろにいる</li><li>TはPより前にいる</li></ul>`,
      c:["Tは必ず先頭である","RはPより後ろにいる","SはTより前にいる","Qは必ず5番目である","PとRは隣り合っている"],
      a:1,
      e:`Pの位置をpとするとQはp+2。TがPより前なのでp≧2、Qが5番目までなのでp≦3。
         p=2のとき T,P,S,Q,R。p=3のときは T,S,P,R,Q と S,T,P,R,Q の2通り。
         この3通りすべてでRはPより後ろにいる。`,
      calc:`① T P S Q R\n② T S P R Q\n③ S T P R Q\n→ どの並びでも P より R が後ろ` },

    { id:"su2", cat:"suiron",
      q:`A〜Eの5人の身長について、次のことがわかっている。このとき、2番目に背が高いのは誰か。
        <ul><li>AはBより高い</li><li>CはAより高い</li><li>DはBより低い</li><li>EはCより低く、Aより高い</li></ul>`,
      c:["A","B","C","D","E"],
      a:4,
      e:`C＞A、C＞E＞A、A＞B＞D を合わせると C＞E＞A＞B＞D の順に決まる。したがって2番目はE。`,
      calc:`C ＞ E ＞ A ＞ B ＞ D` },

    { id:"su3", cat:"suiron",
      q:`A、B、Cの3人が、赤・青・白の帽子を1つずつかぶっている。「Aは赤ではない」「Bは青ではない」「Cは赤ではない」とき、確実にいえることはどれか。`,
      c:["Aは青である","Bは赤である","Cは白である","Aは白である","Cは青である"],
      a:1,
      e:`赤をかぶれるのはAでもCでもないのでBに決まる。BはAでもCでもない残りとして赤。
         AとCは青か白のどちらかだが、どちらがどちらかは決まらない。`,
      calc:`赤 → A×・C× ⇒ B\nA, C は 青／白 のいずれか（確定しない）` },

    { id:"su4", cat:"suiron",
      q:`A〜Dの4チームが総当たり戦（各チーム3試合、引き分けなし）を行った。「Aは全勝した」「BはCに勝った」「DはBに勝った」とき、確実にいえるものはどれか。`,
      c:["Aが単独1位である","Dは2勝している","Cは全敗である","BとDの勝ち数は同じである","Cが単独最下位である"],
      a:0,
      e:`Aは3勝。Bは A に負け・C に勝ち・D に負けで1勝。DとCの対戦結果は不明で、Dが2勝Cが0勝の場合と、Dが1勝Cが1勝の場合の両方があり得る。
         いずれにせよ他チームは最大2勝なので、Aの単独1位だけが確実。`,
      calc:`A=3勝\nB=1勝（○C ×A ×D）\nC・Dの対戦は不明 → D=2,C=0 または D=1,C=1` },

    { id:"su5", cat:"suiron",
      q:`円卓にA〜Fの6人が等間隔で座っている。「AとDは向かい合っている」「BはAの隣に座っている」「CはDの隣で、Bと向かい合っている」とき、確実にいえるものはどれか。`,
      c:["Bの両隣はAとCである","EとFは向かい合っている","DとBは隣り合っている","Aの両隣はBとEである","CはAの隣である"],
      a:1,
      e:`席を1〜6とし、A=1、D=4とする。BはAの隣で2か6。Bの向かいがCで、B=2ならC=5、B=6ならC=3。どちらもCはDの隣になり条件を満たす。
         残る2席はどちらの場合も向かい合う位置（3と6、または2と5）なので、EとFは必ず向かい合う。`,
      calc:`① A1 B2 E/F3 D4 C5 E/F6\n② A1 E/F2 C3 D4 E/F5 B6\nどちらも残り2席は向かい合わせ` },

    /* ── 場合の数 ─────────────────────────── */
    { id:"ba1", cat:"baai",
      q:`男子4人、女子3人の合計7人の中から、委員を3人選ぶ。選び方は何通りあるか。`,
      c:["21通り","30通り","35通り","42通り","210通り"],
      a:2,
      e:`7人から3人を選ぶ組合せなので ₇C₃。順番は関係ないので順列ではないことに注意。`,
      calc:`₇C₃ = (7×6×5)/(3×2×1) = 35 通り` },

    { id:"ba2", cat:"baai",
      q:`男子4人、女子3人の中から、男子2人と女子1人を選ぶ。選び方は何通りあるか。`,
      c:["12通り","18通り","24通り","36通り","72通り"],
      a:1,
      e:`男子の選び方と女子の選び方は独立なので、それぞれの組合せの積で求める。`,
      calc:`₄C₂ × ₃C₁ = 6 × 3 = 18 通り` },

    { id:"ba3", cat:"baai",
      q:`A〜Eの5人が1列に並ぶとき、AとBが隣り合う並び方は何通りあるか。`,
      c:["24通り","48通り","60通り","96通り","120通り"],
      a:1,
      e:`AとBをひとかたまりとみなすと4つのものの並べ方。さらにかたまりの中でAとBの順序が2通り。`,
      calc:`4! × 2 = 24 × 2 = 48 通り` },

    { id:"ba4", cat:"baai",
      q:`6人を3人ずつの2つの組に分ける方法は何通りあるか。`,
      c:["10通り","15通り","20通り","30通り","40通り"],
      a:0,
      e:`6人から3人を選べば残りは自動的に決まる。ただし「組に区別がない」ため、同じ分け方を2回数えている分を2で割る。`,
      calc:`₆C₃ ÷ 2 = 20 ÷ 2 = 10 通り` },

    { id:"ba5", cat:"baai",
      q:`0、1、2、3、4の数字が書かれた5枚のカードから3枚を選んで並べ、3桁の整数をつくる。整数は何個できるか。`,
      c:["36個","40個","48個","60個","64個"],
      a:2,
      e:`百の位に0は使えないので4通り。残り4枚から十の位・一の位を並べるので4×3通り。`,
      calc:`4 × 4 × 3 = 48 個` },

    /* ── 確率 ─────────────────────────────── */
    { id:"ka1", cat:"kakuritsu",
      q:`赤玉3個、白玉5個が入った袋から、同時に2個取り出す。2個とも赤玉である確率はいくらか。`,
      c:["1/28","3/28","3/16","9/64","1/4"],
      a:1,
      e:`全体の取り出し方は ₈C₂＝28通り。赤2個の選び方は ₃C₂＝3通り。`,
      calc:`₃C₂ / ₈C₂ = 3 / 28` },

    { id:"ka2", cat:"kakuritsu",
      q:`大小2個のサイコロを同時に投げるとき、出た目の和が7になる確率はいくらか。`,
      c:["1/12","5/36","1/6","7/36","1/4"],
      a:2,
      e:`目の出方は全部で36通り。和が7になるのは (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) の6通り。`,
      calc:`6 / 36 = 1/6` },

    { id:"ka3", cat:"kakuritsu",
      q:`赤玉3個、白玉5個が入った袋から同時に2個取り出す。少なくとも1個が赤玉である確率はいくらか。`,
      c:["3/28","5/14","3/8","9/14","25/28"],
      a:3,
      e:`「少なくとも1個赤」の余事象は「2個とも白」。全体1から引くのが速い。`,
      calc:`1 − ₅C₂/₈C₂ = 1 − 10/28 = 18/28 = 9/14` },

    { id:"ka4", cat:"kakuritsu",
      q:`Aが的に当てる確率は2/3、Bが当てる確率は1/2である。2人が1回ずつ撃つとき、少なくとも一方が当たる確率はいくらか。`,
      c:["1/3","1/2","2/3","5/6","1/6"],
      a:3,
      e:`余事象は「2人とも外す」。Aが外す確率1/3、Bが外す確率1/2で、これらは独立。`,
      calc:`1 − (1/3 × 1/2) = 1 − 1/6 = 5/6` },

    { id:"ka5", cat:"kakuritsu",
      q:`10本のくじの中に当たりが3本ある。A、Bの順に1本ずつ引き、引いたくじは戻さない。Bが当たる確率はいくらか。`,
      c:["1/5","2/9","7/30","3/10","1/3"],
      a:3,
      e:`Aが当たった場合と外れた場合に分けて足す。結果として先に引いても後に引いても当たる確率は変わらない。`,
      calc:`(3/10 × 2/9) + (7/10 × 3/9)\n = 6/90 + 21/90 = 27/90 = 3/10` },

    /* ── 割合と比 ─────────────────────────── */
    { id:"wa1", cat:"wariai",
      q:`ある品物の定価は原価の4割増しである。原価が2,500円のとき、定価はいくらか。`,
      c:["2,900円","3,000円","3,400円","3,500円","4,000円"],
      a:3,
      e:`4割増しは原価の1.4倍。`,
      calc:`2,500 × 1.4 = 3,500 円` },

    { id:"wa2", cat:"wariai",
      q:`ある学校の男子と女子の人数の比は5:4で、全体は270人である。男子は何人か。`,
      c:["120人","135人","144人","150人","162人"],
      a:3,
      e:`比の合計は5+4=9。全体を9等分した5つ分が男子。`,
      calc:`270 × 5/9 = 150 人` },

    { id:"wa3", cat:"wariai",
      q:`ある学校の生徒の60%が男子で、その男子のうち25%が自転車通学である。自転車通学の男子は全体の何%か。`,
      c:["12%","15%","18%","20%","25%"],
      a:1,
      e:`「〜のうちの〜%」は掛け算。基準がどちらかを取り違えないこと。`,
      calc:`0.60 × 0.25 = 0.15 → 15 %` },

    { id:"wa4", cat:"wariai",
      q:`A:B = 3:4、B:C = 2:5 であるとき、A:B:C はいくらか。`,
      c:["3:4:5","3:4:10","6:8:15","3:8:10","6:8:20"],
      a:1,
      e:`共通するBの値をそろえる。B=4に合わせると B:C = 2:5 は 4:10 になる。`,
      calc:`A:B = 3:4\nB:C = 2:5 = 4:10\n→ A:B:C = 3:4:10` },

    { id:"wa5", cat:"wariai",
      q:`容器いっぱいに入っていた水を、1日目に全体の1/3、2日目に残りの1/4だけ使った。残っている水は全体のどれだけか。`,
      c:["1/3","5/12","1/2","7/12","2/3"],
      a:2,
      e:`2日目の「残りの1/4」は全体の1/4ではないことに注意。1日目終了時の残り2/3が基準になる。`,
      calc:`1日目後 : 1 − 1/3 = 2/3\n2日目使用 : 2/3 × 1/4 = 1/6\n残り : 2/3 − 1/6 = 1/2` },

    /* ── 損益算 ───────────────────────────── */
    { id:"so1", cat:"soneki",
      q:`原価1,200円の商品に、原価の3割の利益を見込んで定価をつけた。定価はいくらか。`,
      c:["1,320円","1,440円","1,500円","1,560円","1,620円"],
      a:3,
      e:`3割の利益を見込む＝原価の1.3倍を定価にする。`,
      calc:`1,200 × 1.3 = 1,560 円` },

    { id:"so2", cat:"soneki",
      q:`定価2,000円の商品を15%引きで販売した。売価はいくらか。`,
      c:["1,600円","1,650円","1,700円","1,750円","1,850円"],
      a:2,
      e:`15%引きは定価の85%。`,
      calc:`2,000 × 0.85 = 1,700 円` },

    { id:"so3", cat:"soneki",
      q:`原価800円の商品に定価をつけたところ、定価の2割引で売っても原価の1割の利益が出た。定価はいくらか。`,
      c:["1,000円","1,050円","1,100円","1,120円","1,200円"],
      a:2,
      e:`売価は原価の1.1倍＝880円。その売価が定価の0.8倍にあたる。`,
      calc:`売価 = 800 × 1.1 = 880\n定価 × 0.8 = 880\n定価 = 880 ÷ 0.8 = 1,100 円` },

    { id:"so4", cat:"soneki",
      q:`ある商品を1,500円で仕入れ、2,100円で売った。原価に対する利益の割合は何%か。`,
      c:["28.6%","30%","35%","40%","60%"],
      a:3,
      e:`利益率は「利益 ÷ 原価」。売価で割らないよう注意。`,
      calc:`利益 = 2,100 − 1,500 = 600\n600 ÷ 1,500 = 0.4 → 40 %` },

    { id:"so5", cat:"soneki",
      q:`原価の4割増しの定価をつけたが売れなかったので、定価の3割引で売ったところ160円の損失となった。原価はいくらか。`,
      c:["4,000円","5,000円","6,400円","8,000円","10,000円"],
      a:3,
      e:`売価は原価の 1.4 × 0.7 = 0.98 倍。原価との差0.02倍分が損失160円にあたる。`,
      calc:`売価 = 原価 × 1.4 × 0.7 = 原価 × 0.98\n損失 = 原価 × 0.02 = 160\n原価 = 160 ÷ 0.02 = 8,000 円` },

    /* ── 仕事算 ───────────────────────────── */
    { id:"si1", cat:"shigoto",
      q:`ある仕事をAだけで行うと12日、Bだけで行うと6日かかる。2人が一緒に行うと何日かかるか。`,
      c:["4日","5日","6日","9日","18日"],
      a:0,
      e:`全体の仕事量を1として、1日あたりの仕事量を足す。`,
      calc:`1/12 + 1/6 = 1/12 + 2/12 = 3/12 = 1/4\n1 ÷ 1/4 = 4 日` },

    { id:"si2", cat:"shigoto",
      q:`ある仕事をAだけで行うと20日かかり、AとBの2人で行うと12日かかる。Bだけで行うと何日かかるか。`,
      c:["24日","28日","30日","32日","36日"],
      a:2,
      e:`2人の1日あたりの仕事量からAの分を引けばBの分が出る。`,
      calc:`1/12 − 1/20 = 5/60 − 3/60 = 2/60 = 1/30\n1 ÷ 1/30 = 30 日` },

    { id:"si3", cat:"shigoto",
      q:`ある仕事を、まずAが6日行い、続けてBが8日行って完成した。この仕事をAだけで行うと10日かかる。Bだけで行うと何日かかるか。`,
      c:["12日","16日","18日","20日","24日"],
      a:3,
      e:`Aが6日で終えた分を先に求め、残りをBが8日で片づけたと考える。`,
      calc:`Aの分 = 6 × 1/10 = 3/5\n残り = 2/5 を8日 → 1日 = 1/20\n1 ÷ 1/20 = 20 日` },

    { id:"si4", cat:"shigoto",
      q:`空の水槽を満たすのに、A管だけでは30分、B管だけでは20分かかる。両方を同時に使うと何分かかるか。`,
      c:["10分","12分","15分","18分","25分"],
      a:1,
      e:`1分あたりに入る量を足し合わせる。`,
      calc:`1/30 + 1/20 = 2/60 + 3/60 = 5/60 = 1/12\n1 ÷ 1/12 = 12 分` },

    { id:"si5", cat:"shigoto",
      q:`12人で行うと15日かかる仕事がある。これを9日で終わらせるには何人必要か。`,
      c:["16人","18人","20人","22人","24人"],
      a:2,
      e:`延べ仕事量（人日）は一定。全体の仕事量を人日で表してから割る。`,
      calc:`12 × 15 = 180 人日\n180 ÷ 9 = 20 人` },

    /* ── 速さ ─────────────────────────────── */
    { id:"ha1", cat:"hayasa",
      q:`時速72kmは秒速何mか。`,
      c:["12m","15m","18m","20m","24m"],
      a:3,
      e:`1km=1,000m、1時間=3,600秒で換算する。時速を3.6で割ると秒速になる。`,
      calc:`72 × 1,000 ÷ 3,600 = 20 m/秒` },

    { id:"ha2", cat:"hayasa",
      q:`家から駅までの1.8kmの道のりを、分速60mで歩いた。何分かかるか。`,
      c:["18分","24分","30分","36分","45分"],
      a:2,
      e:`単位をmにそろえてから「道のり ÷ 速さ」。`,
      calc:`1.8 km = 1,800 m\n1,800 ÷ 60 = 30 分` },

    { id:"ha3", cat:"hayasa",
      q:`長さ150mの列車が時速72kmで走り、長さ250mの鉄橋を渡り始めてから渡り終わるまでに何秒かかるか。`,
      c:["12.5秒","15秒","20秒","25秒","30秒"],
      a:2,
      e:`「渡り終わる」までに進む距離は、鉄橋の長さ＋列車自身の長さ。`,
      calc:`速さ = 72 km/h = 20 m/秒\n距離 = 250 + 150 = 400 m\n400 ÷ 20 = 20 秒` },

    { id:"ha4", cat:"hayasa",
      q:`A地点からB地点まで、行きは時速40km、帰りは時速60kmで往復した。往復の平均の速さは時速何kmか。`,
      c:["時速45km","時速48km","時速50km","時速52km","時速55km"],
      a:1,
      e:`(40+60)÷2 ＝ 50 とするのは誤り。片道の距離を仮に置いて、総距離 ÷ 総時間で求める。`,
      calc:`片道120kmとすると\n行き 120/40 = 3時間、帰り 120/60 = 2時間\n240 ÷ 5 = 時速 48 km` },

    { id:"ha5", cat:"hayasa",
      q:`弟が分速60mで家を出た。その10分後に兄が分速80mで同じ道を追いかけた。兄が弟に追いつくのは、兄が出発してから何分後か。`,
      c:["20分後","25分後","30分後","35分後","40分後"],
      a:2,
      e:`兄が出発した時点での差と、1分あたりに縮まる差を求める。`,
      calc:`最初の差 = 60 × 10 = 600 m\n1分に縮む差 = 80 − 60 = 20 m\n600 ÷ 20 = 30 分後` },

    /* ── 集合 ─────────────────────────────── */
    { id:"sh1", cat:"shugo",
      q:`100人にアンケートをとったところ、犬を飼っている人が45人、猫を飼っている人が38人、どちらも飼っていない人が32人だった。両方飼っている人は何人か。`,
      c:["7人","12人","15人","17人","20人"],
      a:2,
      e:`少なくとも一方を飼っている人数を先に出し、そこから重なりを求める。`,
      calc:`少なくとも一方 = 100 − 32 = 68\n45 + 38 − 両方 = 68\n両方 = 83 − 68 = 15 人` },

    { id:"sh2", cat:"shugo",
      q:`50人の生徒のうち、英語が好きな人が30人、数学が好きな人が25人、両方好きな人が12人である。どちらも好きでない人は何人か。`,
      c:["5人","7人","9人","10人","13人"],
      a:1,
      e:`和集合を求めてから全体から引く。`,
      calc:`30 + 25 − 12 = 43\n50 − 43 = 7 人` },

    { id:"sh3", cat:"shugo",
      q:`200人にアンケートしたところ、商品Aを知っている人が120人、商品Bを知っている人が90人、両方を知っている人が40人だった。Aだけを知っている人は何人か。`,
      c:["50人","60人","70人","80人","90人"],
      a:3,
      e:`「Aだけ」はAを知っている人から両方知っている人を引く。`,
      calc:`120 − 40 = 80 人` },

    { id:"sh4", cat:"shugo",
      q:`100人のうち、A紙を購読している人が62人、B紙を購読している人が45人である。両方購読している人は、最も少なくて何人か。`,
      c:["7人","17人","28人","38人","45人"],
      a:0,
      e:`重なりが最小になるのは、和集合が全体100人いっぱいまで広がるとき。`,
      calc:`62 + 45 − 100 = 7 人` },

    { id:"sh5", cat:"shugo",
      q:`40人のクラスで、兄がいる人が18人、姉がいる人が15人、兄と姉の両方がいる人が6人である。兄も姉もいない人は何人か。`,
      c:["7人","10人","13人","16人","19人"],
      a:2,
      e:`兄または姉がいる人数を求めて全体から引く。`,
      calc:`18 + 15 − 6 = 27\n40 − 27 = 13 人` },

    /* ── 表の読み取り ─────────────────────── */
    { id:"hy1", cat:"hyou", table:SALES_TABLE,
      q:`A店の2024年の売上は、前年に比べて何%増加したか。`,
      c:["12%","13%","15%","18%","20%"],
      a:2,
      e:`増加率は「増加額 ÷ もとの年の売上」。基準は必ず前年（2023年）。`,
      calc:`増加額 = 1,380 − 1,200 = 180\n180 ÷ 1,200 = 0.15 → 15 %` },

    { id:"hy2", cat:"hyou", table:SALES_TABLE,
      q:`2024年の4店舗の売上合計はいくらか。`,
      c:["4,050万円","4,230万円","4,350万円","4,470万円","4,530万円"],
      a:4,
      e:`4店舗の2024年の数値を単純に合計する。`,
      calc:`1,380 + 810 + 1,650 + 690 = 4,530 万円` },

    { id:"hy3", cat:"hyou", table:SALES_TABLE,
      q:`2024年の売上が前年より減少した店舗がある。その店舗の減少率は何%か。`,
      c:["8%","9%","10%","11%","12%"],
      a:2,
      e:`減少しているのはB店（900→810）。減少率は減少額 ÷ 前年の売上。`,
      calc:`減少額 = 900 − 810 = 90\n90 ÷ 900 = 0.10 → 10 %` },

    { id:"hy4", cat:"hyou", table:SALES_TABLE,
      q:`2024年の4店舗の売上合計に占めるC店の割合は、およそ何%か。`,
      c:["約30%","約33%","約36%","約40%","約44%"],
      a:2,
      e:`合計4,530万円に対するC店1,650万円の比率を求める。`,
      calc:`1,650 ÷ 4,530 ≒ 0.364 → 約 36 %` },

    { id:"hy5", cat:"hyou", table:SALES_TABLE,
      q:`2023年から2024年にかけて、売上の増加額が最も大きかった店舗はどれか。`,
      c:["A店","B店","C店","D店","A店とC店で同じ"],
      a:0,
      e:`増加「率」ではなく増加「額」で比べる。C店は増加率では10%だが額では150万円。`,
      calc:`A +180 / B −90 / C +150 / D +90（万円）\n最大は A店` },

    /* ── 料金の割引 ───────────────────────── */
    { id:"wb1", cat:"waribiki",
      q:`ある施設の入場料は1人800円だが、20人を超えた分については2割引になる。35人で入場したときの合計金額はいくらか。`,
      c:["22,400円","24,000円","25,600円","26,400円","28,000円"],
      a:2,
      e:`最初の20人分は定価、残り15人分だけ2割引になる。全員が割引になるわけではない。`,
      calc:`20 × 800 = 16,000\n15 × 640 = 9,600\n合計 25,600 円` },

    { id:"wb2", cat:"waribiki",
      q:`あるサービスは基本料金1,500円で、10回を超えた利用1回につき200円が加算される。18回利用したときの料金はいくらか。`,
      c:["2,600円","3,100円","3,300円","3,600円","5,100円"],
      a:1,
      e:`加算されるのは10回を超えた8回分のみ。`,
      calc:`1,500 + (18 − 10) × 200\n= 1,500 + 1,600 = 3,100 円` },

    { id:"wb3", cat:"waribiki",
      q:`定価1,200円の本は、3冊以上まとめて買うと合計金額から15%引きになる。5冊買うといくらか。`,
      c:["4,800円","5,100円","5,280円","5,400円","5,700円"],
      a:1,
      e:`まず定価での合計を出し、その全体に割引を適用する。`,
      calc:`1,200 × 5 = 6,000\n6,000 × 0.85 = 5,100 円` },

    { id:"wb4", cat:"waribiki",
      q:`ある団体料金は、30人までは1人1,000円、31人目からは1人700円である。48人の団体の合計金額はいくらか。`,
      c:["33,600円","38,400円","41,400円","42,600円","48,000円"],
      a:3,
      e:`30人分と、超過した18人分を分けて計算する。`,
      calc:`30 × 1,000 = 30,000\n18 × 700 = 12,600\n合計 42,600 円` },

    { id:"wb5", cat:"waribiki",
      q:`ある施設は、会員なら年会費3,000円を払ったうえで1回600円、非会員は1回1,000円で利用できる。年に何回以上利用すると、会員のほうが安くなるか。`,
      c:["6回","7回","8回","9回","10回"],
      a:2,
      e:`利用回数をn回として不等式を立てる。7.5回を超えるので、整数では8回から。`,
      calc:`3,000 + 600n ＜ 1,000n\n3,000 ＜ 400n\nn ＞ 7.5 → 8 回以上` },

    /* ── 分割払い・精算 ───────────────────── */
    { id:"bu1", cat:"bunkatsu",
      q:`30万円の商品を、頭金として代金の1/5を支払い、残額を10回の均等分割で支払う。1回あたりの支払額はいくらか。`,
      c:["20,000円","24,000円","25,000円","28,000円","30,000円"],
      a:1,
      e:`頭金を引いた残額を回数で割る。代金全体を10で割らないこと。`,
      calc:`頭金 = 300,000 × 1/5 = 60,000\n残額 = 240,000\n240,000 ÷ 10 = 24,000 円` },

    { id:"bu2", cat:"bunkatsu",
      q:`A、B、Cの3人で旅行し、Aが宿泊費36,000円、Bが交通費21,000円、Cが食費9,000円を立て替えた。費用を3人で均等に負担するとき、CはAにいくら払えばよいか（BもAに不足分を払うものとする）。`,
      c:["9,000円","11,000円","13,000円","14,000円","22,000円"],
      a:2,
      e:`まず1人あたりの負担額を求め、各自の立替額との差を見る。`,
      calc:`合計 66,000 ÷ 3 = 22,000（1人分）\nA +14,000 / B −1,000 / C −13,000\nC → A へ 13,000 円` },

    { id:"bu3", cat:"bunkatsu",
      q:`代金の1/3を頭金として支払い、残額を6回の均等分割で支払う。1回あたりの支払額は代金全体のどれだけにあたるか。`,
      c:["1/6","1/8","1/9","1/12","2/9"],
      a:2,
      e:`残額は全体の2/3。これを6等分する。`,
      calc:`(2/3) ÷ 6 = 2/18 = 1/9` },

    { id:"bu4", cat:"bunkatsu",
      q:`ある品物を、頭金として代金の20%を支払い、残りを月々12,000円ずつ8回で払い終えた。この品物の代金はいくらか。`,
      c:["96,000円","108,000円","115,200円","120,000円","144,000円"],
      a:3,
      e:`分割で支払った総額が代金の80%にあたる。`,
      calc:`12,000 × 8 = 96,000（＝代金の80%）\n96,000 ÷ 0.8 = 120,000 円` },

    { id:"bu5", cat:"bunkatsu",
      q:`4人で食事をし、合計代金は18,400円だった。幹事が他の3人より2,000円多く負担するとき、幹事以外の3人は1人いくら払うことになるか。`,
      c:["3,600円","4,100円","4,300円","4,600円","5,100円"],
      a:1,
      e:`3人の負担額をy円とすると、幹事は y+2,000 円。`,
      calc:`3y + (y + 2,000) = 18,400\n4y = 16,400\ny = 4,100 円` },

    /* ── 濃度算 ───────────────────────────── */
    { id:"no1", cat:"noudo",
      q:`8%の食塩水300gに含まれる食塩は何gか。`,
      c:["16g","21g","24g","27g","30g"],
      a:2,
      e:`食塩の重さ＝食塩水の重さ×濃度。`,
      calc:`300 × 0.08 = 24 g` },

    { id:"no2", cat:"noudo",
      q:`6%の食塩水200gに水を100g加えると、濃度は何%になるか。`,
      c:["2%","3%","4%","4.5%","5%"],
      a:2,
      e:`水を加えても食塩の量は変わらない。分母だけが増える。`,
      calc:`食塩 = 200 × 0.06 = 12 g\n12 ÷ (200 + 100) = 0.04 → 4 %` },

    { id:"no3", cat:"noudo",
      q:`10%の食塩水150gと4%の食塩水250gを混ぜると、濃度は何%になるか。`,
      c:["5.5%","6%","6.25%","6.5%","7%"],
      a:2,
      e:`それぞれの食塩の量を足し、全体の重さで割る。`,
      calc:`15 g + 10 g = 25 g\n25 ÷ 400 = 0.0625 → 6.25 %` },

    { id:"no4", cat:"noudo",
      q:`12%の食塩水400gから水を何g蒸発させると、16%の食塩水になるか。`,
      c:["50g","80g","100g","120g","150g"],
      a:2,
      e:`蒸発するのは水だけなので、食塩の量48gは変わらない。16%になるときの全体の重さを先に求める。`,
      calc:`食塩 = 400 × 0.12 = 48 g\n48 ÷ 0.16 = 300 g（全体）\n400 − 300 = 100 g 蒸発` },

    { id:"no5", cat:"noudo",
      q:`4%の食塩水400gに食塩を何g加えると、20%の食塩水になるか。`,
      c:["60g","64g","72g","80g","96g"],
      a:3,
      e:`加えた食塩の分だけ、食塩の量も全体の重さも増えることに注意して式を立てる。`,
      calc:`食塩 = 400 × 0.04 = 16 g\n(16 + x) ÷ (400 + x) = 0.2\n16 + x = 80 + 0.2x\n0.8x = 64 → x = 80 g` },

    /* ── 年齢算 ───────────────────────────── */
    { id:"ne1", cat:"nenrei",
      q:`現在、父は40歳、子は10歳である。父の年齢が子の年齢の3倍になるのは何年後か。`,
      c:["5年後","6年後","8年後","10年後","15年後"],
      a:0,
      e:`x年後の年齢どうしで式を立てる。父も子も同じだけ年をとることに注意。`,
      calc:`40 + x = 3 × (10 + x)\n40 + x = 30 + 3x\n2x = 10 → x = 5\n(5年後 父45歳・子15歳)` },

    { id:"ne2", cat:"nenrei",
      q:`現在、兄は15歳、弟は9歳である。2人の年齢の和が40歳になるのは何年後か。`,
      c:["4年後","6年後","8年後","10年後","12年後"],
      a:2,
      e:`2人の年齢の和は、1年で2ずつ増える。`,
      calc:`現在の和 = 15 + 9 = 24\n40 − 24 = 16\n16 ÷ 2 = 8 年後` },

    { id:"ne3", cat:"nenrei",
      q:`現在、父の年齢は子の年齢の4倍で、12年後には2倍になる。現在の子の年齢は何歳か。`,
      c:["3歳","4歳","5歳","6歳","8歳"],
      a:3,
      e:`子をc歳とすると父は4c歳。12年後は両方に12を足して、その関係を式にする。`,
      calc:`4c + 12 = 2 × (c + 12)\n4c + 12 = 2c + 24\n2c = 12 → c = 6\n(現在 子6歳・父24歳 → 12年後 18歳・36歳)` },

    { id:"ne4", cat:"nenrei",
      q:`現在、父は48歳、3人の子はそれぞれ15歳、12歳、9歳である。父の年齢が3人の子の年齢の合計と等しくなるのは何年後か。`,
      c:["4年後","6年後","9年後","12年後","18年後"],
      a:1,
      e:`子3人の合計は1年で3ずつ増えるのに対し、父は1ずつしか増えない。`,
      calc:`子の合計 = 15 + 12 + 9 = 36\n48 + x = 36 + 3x\n2x = 12 → x = 6\n(6年後 父54歳、子 21+18+15 = 54)` },

    { id:"ne5", cat:"nenrei",
      q:`現在、Aの年齢はBの年齢の2倍である。5年前、AはBの年齢の3倍だった。現在のAは何歳か。`,
      c:["8歳","10歳","12歳","15歳","20歳"],
      a:4,
      e:`Bをb歳とするとAは2b歳。5年前は両方から5を引いて式を立てる。`,
      calc:`2b − 5 = 3 × (b − 5)\n2b − 5 = 3b − 15\nb = 10 → A = 2b = 20歳\n(5年前 A15歳・B5歳)` },

    /* ── 植木算 ───────────────────────────── */
    { id:"ue1", cat:"ueki",
      q:`長さ120mのまっすぐな道路に、端から端まで6mおきに木を植える。木は何本必要か。`,
      c:["16本","19本","20本","21本","24本"],
      a:3,
      e:`まず間隔の数を求める。両端に木を植える直線では、木の本数は間隔の数より1本多い。`,
      calc:`120 ÷ 6 = 20（間隔の数）\n20 + 1 = 21 本` },

    { id:"ue2", cat:"ueki",
      q:`1周180mの円形の池のまわりに、9mおきに木を植える。木は何本必要か。`,
      c:["18本","19本","20本","21本","22本"],
      a:2,
      e:`円形では出発点と終点が同じ木になるため、木の本数は間隔の数と等しい。直線のように1を足さない。`,
      calc:`180 ÷ 9 = 20 本` },

    { id:"ue3", cat:"ueki",
      q:`長さ100mの道の両側に、両端を含めて5mおきに木を植える。木は全部で何本必要か。`,
      c:["20本","21本","40本","41本","42本"],
      a:4,
      e:`片側の本数を出してから2倍する。片側の計算で+1を忘れやすい。`,
      calc:`片側 : 100 ÷ 5 + 1 = 21 本\n両側 : 21 × 2 = 42 本` },

    { id:"ue4", cat:"ueki",
      q:`21本の木を一直線に等間隔で植えたところ、両端の木の間は120mだった。木と木の間隔は何mか。`,
      c:["6m","6.3m","7m","8m","12m"],
      a:0,
      e:`木が21本なら間隔の数は20。本数で割らないよう注意。`,
      calc:`21 − 1 = 20（間隔の数）\n120 ÷ 20 = 6 m` },

    { id:"ue5", cat:"ueki",
      q:`長さ25cmのテープ8本を、のりしろ3cmずつ重ねて1本につなぐ。全体の長さは何cmか。`,
      c:["176cm","179cm","182cm","197cm","200cm"],
      a:1,
      e:`のりしろの数はテープの本数より1少ない。重なった分だけ全体が短くなる。`,
      calc:`25 × 8 = 200 cm\nのりしろ : (8 − 1) × 3 = 21 cm\n200 − 21 = 179 cm` },

    /* ── 鶴亀算 ───────────────────────────── */
    { id:"tk1", cat:"tsurukame",
      q:`ツルとカメが合わせて20匹いて、足の数の合計は56本である。カメは何匹いるか。`,
      c:["6匹","7匹","8匹","9匹","12匹"],
      a:2,
      e:`全部ツルだと仮定して足の数を出し、実際との差を1匹あたりの差で割る。`,
      calc:`2 × 20 = 40 本（全部ツルと仮定）\n56 − 40 = 16\n16 ÷ (4 − 2) = 8 匹` },

    { id:"tk2", cat:"tsurukame",
      q:`1個80円のみかんと1個120円のりんごを合わせて15個買ったところ、代金は1,480円だった。りんごは何個買ったか。`,
      c:["7個","8個","9個","10個","12個"],
      a:0,
      e:`全部みかんと仮定し、差額を1個あたりの差で割る。`,
      calc:`80 × 15 = 1,200 円（全部みかんと仮定）\n1,480 − 1,200 = 280\n280 ÷ (120 − 80) = 7 個` },

    { id:"tk3", cat:"tsurukame",
      q:`10円硬貨と50円硬貨が合わせて24枚あり、合計金額は800円である。50円硬貨は何枚あるか。`,
      c:["8枚","10枚","12枚","14枚","16枚"],
      a:3,
      e:`全部10円と仮定する。1枚を50円に置きかえるごとに合計が40円増える。`,
      calc:`10 × 24 = 240 円（全部10円と仮定）\n800 − 240 = 560\n560 ÷ (50 − 10) = 14 枚` },

    { id:"tk4", cat:"tsurukame",
      q:`1問正解すると5点もらえ、不正解だと2点減点されるテストがある。20問すべてに解答して58点だった。正解したのは何問か。`,
      c:["8問","10問","12問","13問","14問"],
      a:4,
      e:`全問正解を基準にする。1問まちがえるごとに、もらえない5点と減点2点で7点下がる。`,
      calc:`5 × 20 = 100 点（全問正解と仮定）\n100 − 58 = 42\n42 ÷ (5 + 2) = 6 問不正解\n20 − 6 = 14 問正解` },

    { id:"tk5", cat:"tsurukame",
      q:`大人1人500円、子ども1人300円の入場料の施設に、合わせて30人が入場し、合計金額は12,200円だった。大人は何人か。`,
      c:["14人","16人","18人","20人","24人"],
      a:1,
      e:`全員子どもと仮定し、差額を1人あたりの差で割る。`,
      calc:`300 × 30 = 9,000 円（全員子どもと仮定）\n12,200 − 9,000 = 3,200\n3,200 ÷ (500 − 300) = 16 人` },

    /* ── n進法 ────────────────────────────── */
    { id:"ns1", cat:"nshin",
      q:`2進法の 1011 を10進法で表すといくつか。`,
      c:["9","11","13","15","23"],
      a:1,
      e:`2進法の桁の重みは右から 1、2、4、8。1が立っている桁の重みを足す。`,
      calc:`1×8 + 0×4 + 1×2 + 1×1\n= 8 + 2 + 1 = 11` },

    { id:"ns2", cat:"nshin",
      q:`10進法の 25 を2進法で表すとどうなるか。`,
      c:["10011","10101","11001","11010","11100"],
      a:2,
      e:`2で割った余りを下から並べる。または大きい桁の重みから引いていく。`,
      calc:`25 = 16 + 8 + 1\n= 1×16 + 1×8 + 0×4 + 0×2 + 1×1\n→ 11001` },

    { id:"ns3", cat:"nshin",
      q:`2進法の 1101 と 110 の和を、2進法で表すとどうなるか。`,
      c:["10011","10101","11001","11011","11101"],
      a:0,
      e:`いったん10進法に直して足し、結果を2進法に戻すのが確実。`,
      calc:`1101 → 13、110 → 6\n13 + 6 = 19\n19 = 16 + 2 + 1 → 10011` },

    { id:"ns4", cat:"nshin",
      q:`3進法の 210 を10進法で表すといくつか。`,
      c:["12","15","18","21","27"],
      a:3,
      e:`3進法の桁の重みは右から 1、3、9。2進法と同じ要領で桁の重みをかけて足す。`,
      calc:`2×9 + 1×3 + 0×1\n= 18 + 3 = 21` },

    { id:"ns5", cat:"nshin",
      q:`10進法の 100 を5進法で表すとどうなるか。`,
      c:["130","220","301","340","400"],
      a:4,
      e:`5進法の桁の重みは右から 1、5、25。100は25の4つ分でちょうど割り切れる。`,
      calc:`100 ÷ 25 = 4 あまり 0\n= 4×25 + 0×5 + 0×1\n→ 400` }
  ];

  const KEYS = ["A", "B", "C", "D", "E"];

  /* ══ 保存データ ════════════════════════════════════ */
  const STORE = "spi-nonverbal-v1";
  const HIST_MAX = 3;
  let storageOK = true;
  try {
    localStorage.setItem(STORE + "-probe", "1");
    localStorage.removeItem(STORE + "-probe");
  } catch (err) { storageOK = false; }

  let rec = { stats: {}, wrong: [], hist: {} };
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === "object") {
        rec.stats = p.stats || {};
        rec.wrong = Array.isArray(p.wrong) ? p.wrong : [];
        rec.hist = (p.hist && typeof p.hist === "object") ? p.hist : {};
      }
    }
  } catch (err) { /* 保存が使えない環境ではその場だけの記録になる */ }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(rec)); } catch (err) {}
  }

  /* 直近 HIST_MAX 回の正否。o=正解 / x=まちがい / u=わからない */
  function pushHist(id, mark) {
    const h = rec.hist[id] || (rec.hist[id] = []);
    h.push(mark);
    while (h.length > HIST_MAX) h.shift();
  }

  function histHTML(id) {
    const h = rec.hist[id] || [];
    if (!h.length) return "";
    const slots = Array(HIST_MAX - h.length).fill("none").concat(h);
    return '<span class="hist"><span class="hist-label">直近' + HIST_MAX + '回</span>' +
      slots.map(m => '<i class="' + m + '"></i>').join("") + "</span>";
  }

  /* ══ 状態 ══════════════════════════════════════════ */
  const UNKNOWN = -1;   // 「わからない」
  const TIMEUP  = -2;   // 時間切れ（本番モード）

  let selectedCats = new Set(CATS.map(c => c[0]));
  let quizLen = 10;
  let mode = "practice";     // "practice" | "exam"
  let limitSec = 75;
  let list = [];
  let idx = 0;
  let picked = null;
  let answered = false;
  let session = [];
  let reviewMode = false;    // 復習セッション（正答率に加算しない）
  let qStart = 0;
  let sessionStart = 0;
  let ticker = null;

  /* ══ DOM ═══════════════════════════════════════════ */
  const $ = id => document.getElementById(id);
  const screens = { home: $("screen-home"), quiz: $("screen-quiz"), result: $("screen-result") };
  const dock = $("dock"), dockInner = $("dock-inner");

  function show(name) {
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
    window.scrollTo(0, 0);
  }

  /* ══ 確認シート ════════════════════════════════════ */
  const sheet = $("sheet");
  let sheetOpts = null;
  let sheetOpener = null;

  function ask(opts) {
    sheetOpts = opts;
    sheetOpener = document.activeElement;
    $("sheet-title").textContent = opts.title;
    $("sheet-msg").textContent = opts.msg;
    const ok = $("sheet-ok");
    ok.textContent = opts.ok;
    ok.className = "btn" + (opts.danger ? " danger" : "");
    sheet.classList.remove("hidden");
    ok.focus();
  }

  function closeSheet(cancelled) {
    const opts = sheetOpts;
    sheet.classList.add("hidden");
    sheetOpts = null;
    if (sheetOpener && sheetOpener.focus) sheetOpener.focus();
    sheetOpener = null;
    if (cancelled && opts && opts.onCancel) opts.onCancel();
  }

  $("sheet-ok").addEventListener("click", () => {
    const run = sheetOpts && sheetOpts.onYes;
    closeSheet(false);
    if (run) run();
  });
  $("sheet-cancel").addEventListener("click", () => closeSheet(true));
  $("sheet-back").addEventListener("click", () => closeSheet(true));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !sheet.classList.contains("hidden")) closeSheet(true);
  });

  /* ══ テーマ切り替え ════════════════════════════════ */
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const now = root.getAttribute("data-theme");
    const dark = now ? now === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  /* ══ ホーム ════════════════════════════════════════ */
  function countFor(cat) { return Q.filter(q => q.cat === cat).length; }

  function renderChips() {
    const wrap = $("cat-chips");
    wrap.innerHTML = "";
    CATS.forEach(([key, label]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", selectedCats.has(key));
      b.innerHTML = label + ' <span class="n">' + countFor(key) + "</span>";
      b.addEventListener("click", () => {
        if (selectedCats.has(key)) selectedCats.delete(key); else selectedCats.add(key);
        b.setAttribute("aria-pressed", selectedCats.has(key));
        updateHomeDock();
      });
      wrap.appendChild(b);
    });
  }

  $("cat-all").addEventListener("click", () => {
    selectedCats = new Set(CATS.map(c => c[0]));
    renderChips(); updateHomeDock();
  });
  $("cat-none").addEventListener("click", () => {
    selectedCats = new Set();
    renderChips(); updateHomeDock();
  });

  $("mode-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]");
    if (!b) return;
    mode = b.dataset.mode;
    [...$("mode-seg").children].forEach(c => c.setAttribute("aria-pressed", c === b));
    $("limit-block").classList.toggle("hidden", mode !== "exam");
    $("mode-note").textContent = mode === "exam"
      ? "1問ごとに制限時間があり、時間切れは自動で次へ進みます。解説は最後にまとめて確認します。"
      : "時間制限なし。1問ごとに答え合わせと解説が出ます。";
    updateHomeDock();
  });

  $("limit-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-sec]");
    if (!b) return;
    limitSec = Number(b.dataset.sec);
    [...$("limit-seg").children].forEach(c => c.setAttribute("aria-pressed", c === b));
  });

  $("len-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-len]");
    if (!b) return;
    quizLen = Number(b.dataset.len);
    [...$("len-seg").children].forEach(c => c.setAttribute("aria-pressed", c === b));
    updateHomeDock();
  });

  function pool() { return Q.filter(q => selectedCats.has(q.cat)); }

  function renderRecord() {
    let tot = 0, cor = 0;
    CATS.forEach(([key]) => {
      const s = rec.stats[key];
      if (s) { tot += s.total; cor += s.correct; }
    });
    $("rec-pct").textContent = tot ? Math.round(cor / tot * 100) + "%" : "—";
    $("rec-sub").textContent = tot ? cor + " / " + tot + " 問正解（累計）" : "まだ解答がありません";

    const rows = $("rec-rows");
    rows.innerHTML = "";
    CATS.forEach(([key, label]) => {
      const s = rec.stats[key];
      if (!s || !s.total) return;
      const p = Math.round(s.correct / s.total * 100);
      const row = document.createElement("div");
      row.className = "stat-row";
      const cls = p < 50 ? "low" : (p < 80 ? "mid" : "");
      row.innerHTML =
        '<span class="name">' + label + '</span>' +
        '<span class="meter"><span class="' + cls + '" style="width:' + p + '%"></span></span>' +
        '<span class="val">' + p + '% ' + s.correct + '/' + s.total + '</span>';
      rows.appendChild(row);
    });
    if (!rows.children.length) {
      rows.innerHTML = '<p class="lede" style="font-size:.85rem;margin:0">解いた分野がここに並びます。</p>';
    }
    if (!storageOK) {
      rows.insertAdjacentHTML("beforeend",
        '<p class="lede" style="font-size:.8rem;margin:.6rem 0 0;color:var(--na)">' +
        "このブラウザでは保存が使えないため、記録はこの画面を閉じるまでの一時的なものになります。</p>");
    }

    const bw = $("btn-wrong");
    const n = rec.wrong.length;
    bw.textContent = n ? "まちがえた問題だけ（" + n + "問）" : "まちがえた問題だけ";
    bw.disabled = n === 0;
    bw.style.opacity = n ? "1" : ".45";
  }

  $("btn-wrong").addEventListener("click", () => {
    const ids = new Set(rec.wrong);
    const l = Q.filter(q => ids.has(q.id));
    if (l.length) start(shuffle(l), true);
  });

  $("btn-reset").addEventListener("click", () => {
    ask({
      title: "学習記録を消去しますか",
      msg: "分野別の正答率、復習リスト、直近3回の正否をすべて消します。元に戻せません。",
      ok: "消去する",
      danger: true,
      onYes: () => {
        rec = { stats: {}, wrong: [], hist: {} };
        save();
        renderRecord();
      }
    });
  });

  function updateHomeDock() {
    const n = pool().length;
    const take = quizLen === 0 ? n : Math.min(quizLen, n);
    const btn = dockInner.querySelector(".btn");
    if (!btn) return;
    btn.disabled = n === 0;
    btn.textContent = n === 0
      ? "分野を1つ以上選んでください"
      : (mode === "exam" ? "本番モードで" + take + "問" : take + "問を始める");
    $("m-count").textContent = "全" + Q.length + "問";
  }

  function homeDock() {
    dockInner.innerHTML = "";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.addEventListener("click", () => {
      const p = shuffle(pool());
      const take = quizLen === 0 ? p.length : Math.min(quizLen, p.length);
      if (take) start(p.slice(0, take), false);
    });
    dockInner.appendChild(b);
    dock.classList.remove("hidden");
    updateHomeDock();
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ══ 演習 ══════════════════════════════════════════ */
  function fmt(ms) {
    const t = Math.max(0, Math.round(ms / 1000));
    return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  }

  function stopTimer() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }

  function startTimer() {
    stopTimer();
    if (mode !== "exam") return;
    tick();
    ticker = setInterval(tick, 200);
  }

  function tick() {
    const left = limitSec * 1000 - (Date.now() - qStart);
    const clock = $("m-clock"), fill = $("timer-fill");
    const sec = Math.max(0, Math.ceil(left / 1000));
    clock.textContent = "残り " + sec + "秒";
    clock.className = "clock" + (sec <= 5 ? " crit" : sec <= 15 ? " warn" : "");
    fill.style.width = Math.max(0, left / (limitSec * 1000) * 100) + "%";
    fill.className = sec <= 5 ? "crit" : sec <= 15 ? "warn" : "";
    if (left <= 0) { stopTimer(); commit(TIMEUP); }
  }

  function start(l, isReview) {
    list = l; idx = 0; session = [];
    reviewMode = !!isReview;
    sessionStart = Date.now();
    show("quiz");
    renderQ();
  }

  function renderQ() {
    const q = list[idx];
    picked = null; answered = false;

    $("q-tag").textContent = CAT_NAME[q.cat];
    $("q-text").innerHTML = q.q;
    $("q-table").innerHTML = q.table || "";
    $("q-verdict").innerHTML = "";
    $("pad").value = "";
    document.querySelector("details.memo").open = false;

    const box = $("q-choices");
    box.innerHTML = "";

    function makeChoice(val, key, text, extraClass) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice" + (extraClass ? " " + extraClass : "");
      b.dataset.val = val;
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="key">' + key + "</span><span>" + text + "</span>";
      b.addEventListener("click", () => {
        if (answered) return;
        picked = val;
        [...box.children].forEach(c => c.setAttribute("aria-pressed", Number(c.dataset.val) === val));
        quizDock();
      });
      box.appendChild(b);
    }

    q.c.forEach((text, i) => makeChoice(i, KEYS[i], text));
    makeChoice(UNKNOWN, "?", "わからない", "unknown");

    $("m-count").textContent = (idx + 1) + " / " + list.length;
    $("m-review").classList.toggle("hidden", !reviewMode);
    const sc = $("m-score");
    if (mode === "exam") {
      sc.classList.add("hidden");
      $("m-clock").classList.remove("hidden");
      $("timer").classList.remove("hidden");
    } else {
      sc.classList.toggle("hidden", session.length === 0);
      sc.innerHTML = "正解 <b>" + session.filter(s => s.ok).length + "</b>";
      $("m-clock").classList.add("hidden");
      $("timer").classList.add("hidden");
    }
    $("rule-fill").style.width = (idx / list.length * 100) + "%";

    qStart = Date.now();
    startTimer();
    quizDock();
    window.scrollTo(0, 0);
  }

  function quizDock() {
    dockInner.innerHTML = "";
    const quit = document.createElement("button");
    quit.type = "button";
    quit.className = "btn ghost";
    quit.textContent = "中断";
    quit.addEventListener("click", () => {
      // 確認中はタイマーを止め、取り消したら残り時間から再開する
      const left = limitSec * 1000 - (Date.now() - qStart);
      stopTimer();
      ask({
        title: "演習を中断しますか",
        msg: "ここまでの解答は記録に残ります。解答前のこの問題は記録されません。",
        ok: "中断してホームへ",
        onYes: toHome,
        onCancel: () => {
          if (mode === "exam" && !answered) {
            qStart = Date.now() - (limitSec * 1000 - left);
            startTimer();
          }
        }
      });
    });

    const main = document.createElement("button");
    main.type = "button";
    main.className = "btn";
    if (!answered) {
      const last = idx + 1 === list.length;
      main.textContent = mode === "exam" ? (last ? "解答して結果へ" : "解答して次へ") : "解答する";
      main.disabled = picked === null;
      main.addEventListener("click", () => commit(picked));
    } else {
      main.textContent = idx + 1 < list.length ? "次の問題へ" : "結果を見る";
      main.addEventListener("click", next);
    }
    dockInner.appendChild(quit);
    dockInner.appendChild(main);
  }

  function next() {
    if (idx + 1 < list.length) { idx++; renderQ(); } else { finish(); }
  }

  /* val: 0〜4 = 選択肢 / UNKNOWN = わからない / TIMEUP = 時間切れ */
  function commit(val) {
    if (answered) return;
    const q = list[idx];
    answered = true;
    stopTimer();
    const ok = val === q.a;
    const ms = Date.now() - qStart;

    // 解き直し（復習セッション）は累計の正答率に加算しない
    if (!reviewMode) {
      const s = rec.stats[q.cat] || (rec.stats[q.cat] = { correct: 0, total: 0 });
      s.total++;
      if (ok) s.correct++;
    }
    if (ok) {
      rec.wrong = rec.wrong.filter(id => id !== q.id);
    } else if (!rec.wrong.includes(q.id)) {
      rec.wrong.push(q.id);
    }
    // 直近の正否は練習モードでのみ記録する
    if (mode === "practice") {
      pushHist(q.id, ok ? "o" : val === UNKNOWN ? "u" : "x");
    }
    save();

    session.push({ q: q, ok: ok, picked: val, ms: ms });
    $("rule-fill").style.width = ((idx + 1) / list.length * 100) + "%";

    if (mode === "exam") { next(); return; }
    showVerdict(q, val, ok);

    const sc = $("m-score");
    sc.classList.remove("hidden");
    sc.innerHTML = "正解 <b>" + session.filter(x => x.ok).length + "</b>";
    quizDock();
  }

  function showVerdict(q, val, ok) {
    const box = $("q-choices");
    [...box.children].forEach(c => {
      const v = Number(c.dataset.val);
      c.disabled = true;
      c.setAttribute("aria-pressed", "false");
      if (v === q.a) {
        c.classList.add("is-ok");
        c.insertAdjacentHTML("beforeend", '<span class="mark">✓</span>');
      } else if (v === val && val === UNKNOWN) {
        c.classList.add("is-na");
        c.insertAdjacentHTML("beforeend", '<span class="mark">—</span>');
      } else if (v === val) {
        c.classList.add("is-ng");
        c.insertAdjacentHTML("beforeend", '<span class="mark">✕</span>');
      }
    });

    const head = ok ? "✓ 正解"
      : val === UNKNOWN ? "— わからない　正解は " + KEYS[q.a]
      : "✕ 不正解　正解は " + KEYS[q.a];
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : val === UNKNOWN ? "na" : "ng");
    v.innerHTML =
      '<div class="verdict-head">' + head + histHTML(q.id) + "</div>" +
      '<div class="verdict-body">' +
        '<span class="exp-label">解説</span>' +
        "<p>" + q.e + "</p>" +
        (q.calc ? '<div class="calc">' + q.calc + "</div>" : "") +
      "</div>";
    $("q-verdict").appendChild(v);
    v.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ══ 結果 ══════════════════════════════════════════ */
  function finish() {
    stopTimer();
    $("m-clock").classList.add("hidden");
    $("timer").classList.add("hidden");

    const n = session.length;
    const cor = session.filter(s => s.ok).length;
    const unk = session.filter(s => s.picked === UNKNOWN).length;
    const tmo = session.filter(s => s.picked === TIMEUP).length;
    const wrongPick = n - cor - unk - tmo;
    const p = Math.round(cor / n * 100);
    const total = Date.now() - sessionStart;
    const avg = session.reduce((a, s) => a + s.ms, 0) / n;

    $("res-score").innerHTML = cor + '<small> / ' + n + " 問正解</small>";
    $("res-comment").textContent =
      unk >= n / 2   ? "まだ手が出ない問題が多い状態です。「わからない」を選んだ分野の解説から埋めていきましょう。" :
      p === 100      ? "全問正解。この分野はもう仕上がっています。" :
      p >= 80 && unk ? "解ける型は安定しています。あとは「わからない」で飛ばした型を潰すだけです。" :
      p >= 80        ? "安定して解けています。まちがえた型だけ押さえ直しましょう。" :
      p >= 60        ? "解法は入っています。取りこぼした分野を重点的に。" :
      p >= 40        ? "解き方の型がまだ定着していません。解説の式を追い直しましょう。" :
                       "まずは1分野ずつ。解説の計算を書き写すところから始めましょう。";

    const note = $("res-note");
    note.classList.toggle("hidden", !reviewMode);
    if (reviewMode) {
      note.textContent = "解き直しのため、この結果は学習記録の正答率には加算していません。"
        + (mode === "practice" ? "正解した問題は復習リストから外れ、直近の正否には記録されます。"
                               : "正解した問題は復習リストから外れます。");
    }

    const cells = [
      ["正解", cor, "ok"],
      ["まちがい", wrongPick, "ng"],
      ["わからない", unk, "na"],
      [mode === "exam" ? "時間切れ" : "所要時間", mode === "exam" ? tmo : null, ""]
    ];
    $("res-tally").innerHTML = cells.map(([label, val, cls]) =>
      '<div><span class="t-label">' + label + '</span><span class="t-val ' + cls + '">' +
      (val === null ? fmt(total) : val + '<small> 問</small>') + "</span></div>"
    ).join("") +
      '<div style="grid-column:1/-1"><span class="t-label">' +
      (mode === "exam" ? "所要時間 / 1問平均" : "1問あたりの平均") + '</span><span class="t-val">' +
      (mode === "exam" ? fmt(total) + ' <small>/ ' + Math.round(avg / 1000) + '秒</small>'
                       : Math.round(avg / 1000) + '<small> 秒</small>') + "</span></div>";

    const byCat = {};
    session.forEach(s => {
      const b = byCat[s.q.cat] || (byCat[s.q.cat] = { c: 0, t: 0 });
      b.t++; if (s.ok) b.c++;
    });
    const cw = $("res-cats");
    cw.innerHTML = "";
    CATS.forEach(([key, label]) => {
      const b = byCat[key];
      if (!b) return;
      const pc = Math.round(b.c / b.t * 100);
      const cls = pc < 50 ? "low" : (pc < 80 ? "mid" : "");
      const row = document.createElement("div");
      row.className = "stat-row";
      row.innerHTML =
        '<span class="name">' + label + "</span>" +
        '<span class="meter"><span class="' + cls + '" style="width:' + pc + '%"></span></span>' +
        '<span class="val">' + b.c + "/" + b.t + "</span>";
      cw.appendChild(row);
    });

    const wrongs = session.filter(s => !s.ok);
    // 本番モードは解説を出していないので全問、練習モードはまちがえた問題だけ振り返る
    const shown = mode === "exam" ? session : wrongs;
    $("res-review-label").textContent = mode === "exam" ? "全問の解説" : "まちがえた問題";
    $("res-review-block").classList.toggle("hidden", shown.length === 0);
    const rw = $("res-review");
    rw.innerHTML = "";
    shown.forEach(s => {
      const d = document.createElement("div");
      d.className = "review-item";
      const plain = s.q.q.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      const badge = s.ok ? '<span class="badge ok">✓</span>'
        : s.picked === UNKNOWN || s.picked === TIMEUP ? '<span class="badge na">—</span>'
        : '<span class="badge ng">✕</span>';
      const mine = s.picked === UNKNOWN ? "<em>わからない</em>"
        : s.picked === TIMEUP ? "<em>時間切れ</em>"
        : KEYS[s.picked] + ". " + s.q.c[s.picked];
      d.innerHTML =
        badge + '<span class="qtag" style="margin:0">' + CAT_NAME[s.q.cat] + "</span>" +
        '<p class="rq">' + (plain.length > 70 ? plain.slice(0, 70) + "…" : plain) + "</p>" +
        '<p class="ra">あなたの解答：' + mine + "　／　正解：<b>" +
          KEYS[s.q.a] + ". " + s.q.c[s.q.a] + "</b></p>" +
        (mode === "practice" ? histHTML(s.q.id) : "") +
        (mode === "exam"
          ? "<details><summary>解説</summary><p class=\"exp\">" + s.q.e + "</p>" +
            (s.q.calc ? '<div class="calc">' + s.q.calc + "</div>" : "") + "</details>"
          : "");
      rw.appendChild(d);
    });

    $("m-count").textContent = "結果";
    $("m-score").classList.add("hidden");
    $("rule-fill").style.width = "100%";

    dockInner.innerHTML = "";
    const again = document.createElement("button");
    again.type = "button";
    again.className = "btn";
    if (wrongs.length) {
      again.textContent = "まちがえた " + wrongs.length + " 問を解き直す";
      again.addEventListener("click", () => start(shuffle(wrongs.map(s => s.q)), true));
    } else {
      again.textContent = "もう一度おなじ設定で";
      again.addEventListener("click", () => {
        const p2 = shuffle(pool());
        const take = quizLen === 0 ? p2.length : Math.min(quizLen, p2.length);
        if (take) start(p2.slice(0, take), false);
      });
    }
    const home = document.createElement("button");
    home.type = "button";
    home.className = "btn ghost";
    home.textContent = "ホーム";
    home.addEventListener("click", toHome);

    dockInner.appendChild(home);
    dockInner.appendChild(again);
    show("result");
  }

  function toHome() {
    stopTimer();
    $("rule-fill").style.width = "0%";
    $("m-score").classList.add("hidden");
    $("m-clock").classList.add("hidden");
    $("m-review").classList.add("hidden");
    $("timer").classList.add("hidden");
    reviewMode = false;
    renderRecord();
    show("home");
    homeDock();
  }

  /* ══ 起動 ══════════════════════════════════════════ */
  $("home-eyebrow").textContent = "非言語 · " + CATS.length + "分野 · " + Q.length + "問";
  renderChips();
  renderRecord();
  homeDock();
})();
</script>
