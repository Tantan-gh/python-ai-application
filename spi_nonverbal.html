<title>SPI非言語 問題集</title>

<style>
  :root {
    --bg:        #EDF0F5;
    --surface:   #FFFFFF;
    --surface-2: #F5F7FA;
    --ink:       #16233C;
    --ink-2:     #5A6885;
    --ink-3:     #8A97AF;
    --line:      #D2DAE6;
    --line-soft: #E3E9F1;
    --accent:    #22376F;
    --accent-2:  #3D5FA8;
    --accent-bg: #E5EAF5;
    --ok:        #1B7A5A;
    --ok-bg:     #E3F1EB;
    --ng:        #B23A2E;
    --ng-bg:     #F7E5E2;
    --na:        #8A6A16;
    --na-bg:     #F5EDD9;
    --grid:      rgba(34, 55, 111, .07);
    --on-accent: #FFFFFF;
    --scrim:     rgba(15, 23, 40, .48);
    --shadow:    0 1px 2px rgba(22, 35, 60, .05), 0 8px 24px -16px rgba(22, 35, 60, .35);

    --mincho: "Hiragino Mincho ProN", "HiraMinProN-W3", "Yu Mincho", YuMincho, "Noto Serif JP", "Songti SC", serif;
    --gothic: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
    --mono:   ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0E1420;
      --surface:   #161E2C;
      --surface-2: #1C2536;
      --ink:       #E5EAF3;
      --ink-2:     #9AA6BC;
      --ink-3:     #6E7C95;
      --line:      #2B3549;
      --line-soft: #222C3D;
      --accent:    #8FAEE8;
      --accent-2:  #A8C0EF;
      --accent-bg: #1E2A42;
      --ok:        #4FBF95;
      --ok-bg:     #122C25;
      --ng:        #E4816F;
      --ng-bg:     #2E1A17;
      --na:        #D9B75C;
      --na-bg:     #2B2413;
      --grid:      rgba(143, 174, 232, .08);
      --on-accent: #0E1420;
      --scrim:     rgba(0, 0, 0, .62);
      --shadow:    0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }

  :root[data-theme="light"] {
    --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA;
    --ink:#16233C; --ink-2:#5A6885; --ink-3:#8A97AF;
    --line:#D2DAE6; --line-soft:#E3E9F1;
    --accent:#22376F; --accent-2:#3D5FA8; --accent-bg:#E5EAF5;
    --ok:#1B7A5A; --ok-bg:#E3F1EB; --ng:#B23A2E; --ng-bg:#F7E5E2;
    --na:#8A6A16; --na-bg:#F5EDD9;
    --grid:rgba(34,55,111,.07); --on-accent:#FFFFFF; --scrim:rgba(15,23,40,.48);
    --shadow:0 1px 2px rgba(22,35,60,.05), 0 8px 24px -16px rgba(22,35,60,.35);
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg:#0E1420; --surface:#161E2C; --surface-2:#1C2536;
    --ink:#E5EAF3; --ink-2:#9AA6BC; --ink-3:#6E7C95;
    --line:#2B3549; --line-soft:#222C3D;
    --accent:#8FAEE8; --accent-2:#A8C0EF; --accent-bg:#1E2A42;
    --ok:#4FBF95; --ok-bg:#122C25; --ng:#E4816F; --ng-bg:#2E1A17;
    --na:#D9B75C; --na-bg:#2B2413;
    --grid:rgba(143,174,232,.08); --on-accent:#0E1420; --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--gothic);
    font-size: 16px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 42rem;
    margin: 0 auto;
    padding: 0 1rem 7rem;
  }

  /* ── 上部バー ───────────────────────────── */
  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 0 -1rem;
    padding: .55rem 1rem .45rem;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
  }
  .bar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
  }
  .bar-title {
    font-family: var(--mincho);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: .06em;
    margin: 0;
  }
  .bar-meta {
    display: flex;
    align-items: center;
    gap: .9rem;
    font-family: var(--mono);
    font-size: .78rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .bar-meta b { color: var(--ink); font-weight: 600; }
  .rule {
    height: 3px;
    margin-top: .45rem;
    background: var(--line-soft);
    border-radius: 2px;
    overflow: hidden;
  }
  .rule span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .3s ease;
  }
  @media (prefers-reduced-motion: reduce) { .rule span { transition: none; } }

  .timer { margin-top: .3rem; height: 4px; }
  .timer span { transition: none; background: var(--accent-2); }
  .timer span.warn { background: var(--na); }
  .timer span.crit { background: var(--ng); }
  .clock { font-variant-numeric: tabular-nums; }
  .clock.warn { color: var(--na); }
  .clock.crit { color: var(--ng); font-weight: 700; }

  .flag {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .1em;
    color: var(--na);
    background: var(--na-bg);
    border-radius: 4px;
    padding: .1rem .4rem;
  }

  /* 直近3回の正否 */
  .hist { display: inline-flex; align-items: center; gap: .28rem; }
  .hist .hist-label {
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .12em;
    color: var(--ink-3);
    margin-right: .15rem;
  }
  .hist i {
    width: 9px; height: 9px;
    border-radius: 50%;
    display: block;
    border: 1px solid var(--line);
  }
  .hist i.o { background: var(--ok); border-color: var(--ok); }
  .hist i.x { background: var(--ng); border-color: var(--ng); }
  .hist i.u { background: var(--na); border-color: var(--na); }
  .hist i.none { background: transparent; }
  .verdict-head .hist { margin-left: auto; }
  /* 判定バーは正誤で色がつくので、ドットに地色のふちをつけて分離する */
  .verdict-head .hist i { box-shadow: 0 0 0 1.5px var(--surface); }
  .verdict-head .hist .hist-label { color: currentColor; opacity: .7; }
  .review-item .hist { margin-top: .35rem; }

  .theme-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
    padding: 0;
  }
  .theme-btn svg { width: 15px; height: 15px; display: block; }

  /* ── 共通パーツ ─────────────────────────── */
  .eyebrow {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 .35rem;
  }
  h2.head {
    font-family: var(--mincho);
    font-size: 1.45rem;
    line-height: 1.45;
    font-weight: 600;
    letter-spacing: .02em;
    margin: 0 0 .3rem;
    text-wrap: balance;
  }
  .lede { color: var(--ink-2); font-size: .92rem; margin: 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.1rem;
    box-shadow: var(--shadow);
  }

  section.block { margin-top: 1.5rem; }
  .block-label {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .14em;
    color: var(--ink-3);
    margin: 0 0 .55rem;
    display: flex;
    align-items: baseline;
    gap: .6rem;
  }
  .block-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line-soft);
  }

  .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip {
    font-family: inherit;
    font-size: .85rem;
    padding: .5rem .8rem;
    min-height: 40px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: .45rem;
  }
  .chip .n {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .chip[aria-pressed="true"] .n { color: var(--accent); }

  .seg { display: flex; gap: .5rem; }
  .seg .chip { flex: 1; justify-content: center; }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    min-height: 52px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
    letter-spacing: .04em;
  }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.ghost {
    background: var(--surface);
    color: var(--ink-2);
    border-color: var(--line);
    font-weight: 500;
  }

  :focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  /* ── 学習記録 ───────────────────────────── */
  .stat-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .5rem;
    padding: .45rem 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: .88rem;
  }
  .stat-row:last-child { border-bottom: 0; }
  .stat-row .name { flex: none; width: 7.4em; font-size: .84rem; color: var(--ink-2); }
  .meter {
    flex: 1;
    height: 6px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .meter span.low { background: var(--ng); }
  .meter span.mid { background: var(--accent-2); }
  .stat-row .val {
    font-family: var(--mono);
    font-size: .8rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    flex: none;
    width: 5.2em;
    text-align: right;
  }
  .summary-big {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .summary-big .pct { font-size: 2.6rem; font-weight: 600; letter-spacing: -.02em; }
  .summary-big .sub { font-size: .8rem; color: var(--ink-2); }

  /* ── 問題 ───────────────────────────────── */
  .qtag {
    display: inline-block;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .1em;
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: 4px;
    padding: .15rem .5rem;
    margin-bottom: .7rem;
  }
  /* 難易度：塗られた目盛りの数で易→難を示す */
  .dtag {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .08em;
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    padding: .15rem .45rem;
    margin-left: .35rem;
    vertical-align: middle;
  }
  .dtag .lv { display: inline-flex; gap: 2px; }
  .dtag .lv i {
    width: 3px; height: 9px;
    border-radius: 1px;
    background: var(--line);
    display: block;
  }
  .dtag.d1 .lv i:nth-child(-n+1),
  .dtag.d2 .lv i:nth-child(-n+2),
  .dtag.d3 .lv i:nth-child(-n+3) { background: var(--accent); }

  .qcard {
    background:
      repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(to right,  var(--grid) 0 1px, transparent 1px 22px),
      var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.1rem;
    box-shadow: var(--shadow);
  }
  .qtext { font-size: 1.02rem; line-height: 1.85; margin: 0; }
  .qtext ul { margin: .7rem 0 0; padding-left: 1.2rem; }
  .qtext li { margin: .2rem 0; }
  .table-wrap { overflow-x: auto; margin-top: .9rem; }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 20rem;
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
    background: var(--surface);
  }
  caption {
    caption-side: top;
    text-align: left;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .1em;
    color: var(--ink-3);
    padding-bottom: .35rem;
  }
  th, td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: right; }
  th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); }
  th:first-child, td:first-child { text-align: left; }

  .choices { display: flex; flex-direction: column; gap: .55rem; margin-top: 1rem; }
  .choice {
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-height: 52px;
    padding: .6rem .8rem;
    text-align: left;
    font-family: inherit;
    font-size: .97rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .choice .key {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--ink-2);
  }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
  .choice[aria-pressed="true"] .key { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }

  .choice.is-ok { border-color: var(--ok); background: var(--ok-bg); }
  .choice.is-ok .key { border-color: var(--ok); background: var(--ok); color: var(--on-accent); }
  .choice.is-ng { border-color: var(--ng); background: var(--ng-bg); }
  .choice.is-ng .key { border-color: var(--ng); background: var(--ng); color: var(--on-accent); }
  .choice[disabled] { cursor: default; }
  .choice .mark { margin-left: auto; font-size: 1.1rem; flex: none; }
  .choice.is-ok .mark { color: var(--ok); }
  .choice.is-ng .mark { color: var(--ng); }
  .choice.is-na .mark { color: var(--na); }

  .choice.unknown {
    margin-top: .35rem;
    border-style: dashed;
    color: var(--ink-2);
    font-size: .92rem;
    min-height: 48px;
  }
  .choice.unknown .key { font-size: .9rem; }
  .choice.unknown[aria-pressed="true"] {
    border-style: solid;
    border-color: var(--na);
    background: var(--na-bg);
    color: var(--na);
  }
  .choice.unknown[aria-pressed="true"] .key { border-color: var(--na); background: var(--na); color: var(--on-accent); }
  .choice.unknown.is-na { border-style: solid; border-color: var(--na); background: var(--na-bg); color: var(--na); }
  .choice.unknown.is-na .key { border-color: var(--na); background: var(--na); color: var(--on-accent); }

  /* ── メモ ───────────────────────────────── */
  details.memo { margin-top: .9rem; }
  details.memo summary {
    font-family: var(--mono);
    font-size: .75rem;
    letter-spacing: .1em;
    color: var(--ink-3);
    cursor: pointer;
    padding: .35rem 0;
    list-style: none;
  }
  details.memo summary::-webkit-details-marker { display: none; }
  details.memo summary::before { content: "＋ "; }
  details.memo[open] summary::before { content: "− "; }
  textarea.pad {
    width: 100%;
    min-height: 7rem;
    padding: .6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: .9rem;
    line-height: 22px;
    resize: vertical;
    background:
      repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(to right,  var(--grid) 0 1px, transparent 1px 22px),
      var(--surface-2);
  }

  /* ── 解説 ───────────────────────────────── */
  .verdict {
    margin-top: 1rem;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    overflow: hidden;
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .verdict { animation: none; } }
  .verdict-head {
    display: flex;
    align-items: center;
    gap: .55rem;
    padding: .6rem .9rem;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .verdict.ok  .verdict-head { background: var(--ok-bg); color: var(--ok); }
  .verdict.ng  .verdict-head { background: var(--ng-bg); color: var(--ng); }
  .verdict.na  .verdict-head { background: var(--na-bg); color: var(--na); }
  .verdict-body { padding: .85rem .9rem 1rem; }
  .exp-body .exp-label {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .16em;
    color: var(--ink-3);
    display: block;
    margin-bottom: .35rem;
  }
  .exp-body p { margin: 0; font-size: .93rem; line-height: 1.85; }
  .exp-body .calc { margin-top: 0; }
  .exp-body .exp-label:not(:first-child) { margin-top: 1rem; }

  .tip {
    margin-top: 1rem;
    background: var(--na-bg);
    border-radius: 8px;
    padding: .6rem .75rem;
  }
  .tip .tip-label {
    display: block;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .14em;
    color: var(--na);
    margin-bottom: .2rem;
  }
  .tip p { font-size: .87rem !important; line-height: 1.8 !important; color: var(--ink-2); }
  .calc {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    background: var(--surface-2);
    border-left: 2px solid var(--accent);
    padding: .5rem .7rem;
    margin-top: .7rem;
    font-size: .85rem;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre-wrap;
  }

  /* ── 下部固定バー ───────────────────────── */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line-soft);
  }
  .dock-inner { max-width: 42rem; margin: 0 auto; display: flex; gap: .6rem; }
  .dock .btn { flex: 1; }
  .dock .btn.ghost { flex: 0 0 5.5rem; }

  .hidden { display: none !important; }

  /* ── 確認シート ─────────────────────────
     掲載先の iframe は sandbox 下で confirm() が無視されるため、
     ネイティブダイアログではなくページ内で確認する。 */
  .sheet { position: fixed; inset: 0; z-index: 60; }
  .sheet-back { position: absolute; inset: 0; background: var(--scrim); }
  .sheet-card {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-width: 42rem;
    margin: 0 auto;
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 1.2rem 1rem calc(1.1rem + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 32px -12px rgba(0, 0, 0, .45);
    animation: sheet-up .2s ease-out;
  }
  @keyframes sheet-up { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet-card { animation: none; } }
  .sheet-title {
    font-family: var(--mincho);
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 .35rem;
  }
  .sheet-msg { margin: 0 0 1.1rem; font-size: .9rem; color: var(--ink-2); }
  .sheet-actions { display: flex; gap: .6rem; }
  .sheet-actions .btn { flex: 1; }
  .btn.danger { background: var(--ng); border-color: var(--ng); color: var(--on-accent); }

  /* ── 結果 ───────────────────────────────── */
  .result-hero {
    text-align: center;
    padding: 1.6rem 1rem 1.4rem;
  }
  .result-hero .score {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;

<script>
(function () {

  const CATS = [

  const SALES_TABLE = `

  /* ══ 問題データ ════════════════════════════════════ */
  const Q = [
    /* ── 推論 ─────────────────────────────── */
    { id:"su1", cat:"suiron", d:3,
      q:`P、Q、R、S、Tの5人が1列に並んでいる。次のことがわかっているとき、確実にいえるものはどれか。
        <ul><li>PはQの2つ前にいる</li><li>RはSより後ろにいる</li><li>TはPより前にいる</li></ul>`,
      c:["Tは必ず先頭である","RはPより後ろにいる","SはTより前にいる","Qは必ず5番目である","PとRは隣り合っている"],
      a:1,
      e:`順序の推論は、条件を位置の関係に置きかえてから候補を絞る。Pの位置をpとするとQはp+2に固定される。TがPより前にいるのでpは2以上、Qが5番目までなのでpは3以下。つまりPは2番目か3番目しかあり得ない。あとは残った人を条件どおりに入れて、成り立つ並びをすべて書き出す。`,
      calc:`① T P S Q R\n② T S P R Q\n③ S T P R Q\n→ どの並びでも P より R が後ろ`,
      tip:`「確実にいえる」は、あり得る並びのすべてで成り立つという意味。1通りでも反例が作れれば、その選択肢は切れる。並びが1つに決まらない問題ほど、候補を全部書き出してから選択肢を検討する。` },

    { id:"su2", cat:"suiron", d:2,
      q:`A〜Eの5人の身長について、次のことがわかっている。このとき、2番目に背が高いのは誰か。
        <ul><li>AはBより高い</li><li>CはAより高い</li><li>DはBより低い</li><li>EはCより低く、Aより高い</li></ul>`,
      c:["A","B","C","D","E"],
      a:4,
      e:`与えられた大小関係をつなげて1本の列にできるかを見る。C＞A、A＞B、B＞D をつなぐと C＞A＞B＞D の並びができる。さらにEは「Cより低くAより高い」のでCとAのあいだに入り、5人全員の順位が1つに決まる。`,
      calc:`C ＞ A ＞ B ＞ D\nE は C と A のあいだ\n→ C ＞ E ＞ A ＞ B ＞ D`,
      tip:`条件を1つずつつないでいくと、枝分かれが残るか一列になるかが見えてくる。一列になれば順位は確定し、枝分かれが残る場合は「確実にいえること」しか答えられない。` },

    { id:"su3", cat:"suiron", d:1,
      q:`A、B、Cの3人が、赤・青・白の帽子を1つずつかぶっている。「Aは赤ではない」「Bは青ではない」「Cは赤ではない」とき、確実にいえることはどれか。`,
      c:["Aは青である","Bは赤である","Cは白である","Aは白である","Cは青である"],
      a:1,
      e:`対応関係の推論は表を書いて×を埋めていく。赤に注目すると、Aでもなく、Cでもない。3人のうち2人が消えるので、消去法で赤はBに決まる。一方AとCは青か白のどちらかというところまでしか絞れず、どちらがどちらかは決まらない。`,
      calc:`　　赤　青　白\nA　 ×　 ?　 ?\nB　 ○　 ×　 ×\nC　 ×　 ?　 ?\n→ 赤は B に確定`,
      tip:`3つの選択肢のうち2つが否定されたら、残る1つに確定する。全員ぶんを決めようとせず、確定する部分だけ先に押さえるのがコツ。` },

    { id:"su4", cat:"suiron", d:3,
      q:`A〜Dの4チームが総当たり戦（各チーム3試合、引き分けなし）を行った。「Aは全勝した」「BはCに勝った」「DはBに勝った」とき、確実にいえるものはどれか。`,
      c:["Aが単独1位である","Dは2勝している","Cは全敗である","BとDは同じ勝ち数である","Cが単独最下位である"],
      a:0,
      e:`総当たり戦は「4チームで全6試合、勝ち数の合計も6」を土台にする。Aは3勝。Bは Aに負け・Cに勝ち・Dに負けなので1勝と決まる。残る未確定はCとDの対戦だけで、Dが勝てば D2勝・C0勝、Cが勝てば D1勝・C1勝。どちらでも合計6勝になり矛盾しない。他チームは最大でも2勝なので、Aの単独1位だけが両方の場合に共通する。`,
      calc:`A = 3勝（全勝）\nB = 1勝（○C ×A ×D）\nC・D戦が未確定\n　場合① D2勝・C0勝\n　場合② D1勝・C1勝\nどちらも合計 3+1+2+0 = 3+1+1+1 = 6 ✓`,
      tip:`未確定の試合が残る場合は、両方の場合を書き出して、どちらでも成り立つ選択肢を選ぶ。Cは最下位に見えるが、1勝してBやDと並ぶ可能性が消えていないのが引っかけ。` },

    { id:"su5", cat:"suiron", d:3,
      q:`円卓にA〜Fの6人が等間隔で座っている。「AとDは向かい合っている」「BはAの隣に座っている」「CはDの隣で、Bと向かい合っている」とき、確実にいえるものはどれか。`,
      c:["Bの両隣はAとCである","EとFは向かい合っている","DとBは隣り合っている","Aの両隣はBとEである","CはAの隣である"],
      a:1,
      e:`円卓の問題は席に番号を振り、「向かい合う＝3つ離れている」と読みかえる。A=1、D=4と置くと、BはAの隣なので2か6。その向かいがCなので、B=2ならC=5、B=6ならC=3。どちらもCがDの隣という条件を満たすため、2通りが残る。残った2席は、いずれの場合も向かい合う位置どうしになる。`,
      calc:`席 1〜6、i の正面は i+3\n① A1 B2 (E/F)3 D4 C5 (E/F)6 → 3と6が正面\n② A1 (E/F)2 C3 D4 (E/F)5 B6 → 2と5が正面\nどちらも E と F は向かい合う`,
      tip:`6人の円卓では i の正面は i+3。A=1と固定してよいのは、円卓では回転して重なる配置を同じものと数えるため。` },

    /* ── 場合の数 ─────────────────────────── */
    { id:"ba1", cat:"baai", d:1,
      q:`男子4人、女子3人の合計7人の中から、委員を3人選ぶ。選び方は何通りあるか。`,
      c:["21通り","30通り","35通り","42通り","210通り"],
      a:2,
      e:`3人をまとめて選ぶだけで、誰が何の役かは決めないので組合せを使う。7人から3人を選ぶ ₇C₃ を計算する。もし委員長・副委員長・書記のように役割がつくなら順列 ₇P₃＝210通りになるが、この問題は選ぶだけ。`,
      calc:`₇C₃ = (7×6×5)/(3×2×1) = 35 通り`,
      tip:`順列と組合せの区別は「並び順が結果を変えるか」で判断する。組合せの計算は、分子に7から3個ぶん小さくしながらかけ、分母に3の階乗を置く。` },

    { id:"ba2", cat:"baai", d:1,
      q:`男子4人、女子3人の中から、男子2人と女子1人を選ぶ。選び方は何通りあるか。`,
      c:["12通り","18通り","24通り","36通り","72通り"],
      a:1,
      e:`男子の選び方と女子の選び方は互いに影響しないので、それぞれを求めて掛け合わせる（積の法則）。男子4人から2人で ₄C₂＝6通り、女子3人から1人で ₃C₁＝3通り。`,
      calc:`₄C₂ = (4×3)/(2×1) = 6\n₃C₁ = 3\n6 × 3 = 18 通り`,
      tip:`「かつ」でつながる条件は掛け算、「または」でつながる条件は足し算。ここは男子を選び、かつ女子を選ぶので掛け算になる。` },

    { id:"ba3", cat:"baai", d:2,
      q:`A〜Eの5人が1列に並ぶとき、AとBが隣り合う並び方は何通りあるか。`,
      c:["24通り","48通り","60通り","96通り","120通り"],
      a:1,
      e:`隣り合う条件は、その2人を1つの箱にまとめるのが定石。A・Bをひとかたまりにすると、並べる対象は「AB」「C」「D」「E」の4つになり4!＝24通り。さらに箱の中でABとBAの2通りがあるので2倍する。`,
      calc:`4! = 24（かたまりを含む4つの並べ方）\n× 2（AB と BA）\n= 48 通り`,
      tip:`「隣り合わない」を問われたら、全体から隣り合う場合を引く。5人全体は5!＝120通りなので、隣り合わないのは 120−48＝72通り。` },

    { id:"ba4", cat:"baai", d:3,
      q:`6人を3人ずつの2つの組に分ける方法は何通りあるか。`,
      c:["10通り","15通り","20通り","30通り","40通り"],
      a:0,
      e:`6人から3人を選べば残り3人は自動的に決まるので、まず ₆C₃＝20通り。ただし「ABC と DEF」「DEF と ABC」は同じ分け方なのに、20通りの中では別々に数えられている。すべての分け方が2回ずつ重複しているので2で割る。`,
      calc:`₆C₃ = (6×5×4)/(3×2×1) = 20\n20 ÷ 2 = 10 通り`,
      tip:`組に「1組・2組」のような区別があるなら割らずに20通り。「2つの組に分ける」とだけ書かれていたら区別なしとみなして2で割る。` },

    { id:"ba5", cat:"baai", d:2,
      q:`0、1、2、3、4の数字が書かれた5枚のカードから3枚を選んで並べ、3桁の整数をつくる。整数は何個できるか。`,
      c:["36個","40個","48個","60個","64個"],
      a:2,
      e:`3桁の整数なので、百の位に0を置けないのが急所。百の位は0以外の4通り。百の位が決まると残りは4枚なので、十の位が4通り、一の位が3通り。位の高いほうから順に決めていく。`,
      calc:`百の位 : 0以外で 4 通り\n十の位 : 残り4枚から 4 通り\n一の位 : 残り3枚から 3 通り\n4 × 4 × 3 = 48 個`,
      tip:`0を含むカードの問題は、必ず最上位の位から決める。単純に ₅P₃＝60 とすると、012 のように3桁にならないものまで数えてしまう。` },

    /* ── 確率 ─────────────────────────────── */
    { id:"ka1", cat:"kakuritsu", d:2,
      q:`赤玉3個、白玉5個が入った袋から、同時に2個取り出す。2個とも赤玉である確率はいくらか。`,
      c:["1/28","3/28","3/16","9/64","1/4"],
      a:1,
      e:`確率は「条件に合う場合の数 ÷ 全体の場合の数」。同時に2個なので順番は関係なく、組合せで数える。分母は8個から2個を選ぶ ₈C₂＝28通り、分子は赤3個から2個を選ぶ ₃C₂＝3通り。`,
      calc:`全体 : ₈C₂ = (8×7)/(2×1) = 28\n赤2個 : ₃C₂ = 3\n3 / 28`,
      tip:`(3/8)×(3/8)＝9/64 とするのは誤り。玉は戻さないので、2個目を取るときは残り7個・赤2個に減っている。` },

    { id:"ka2", cat:"kakuritsu", d:1,
      q:`大小2個のサイコロを同時に投げるとき、出た目の和が7になる確率はいくらか。`,
      c:["1/12","5/36","1/6","7/36","1/4"],
      a:2,
      e:`大小2個は区別して数えるので、目の出方は 6×6＝36通り。和が7になるのは (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) の6通り。`,
      calc:`全体 : 6 × 6 = 36 通り\n和が7 : 6 通り\n6 / 36 = 1/6`,
      tip:`2個のサイコロで最も出やすい和は7。6×6の表を書くと、和が7の組は対角線上に6つきれいに並ぶ。` },

    { id:"ka3", cat:"kakuritsu", d:2,
      q:`赤玉3個、白玉5個が入った袋から同時に2個取り出す。少なくとも1個が赤玉である確率はいくらか。`,
      c:["3/28","5/14","3/8","9/14","25/28"],
      a:3,
      e:`「少なくとも1個」は、そうならない場合を全体から引く（余事象）。赤が1個も入らない、つまり2個とも白である確率を求めて、1から引く。白5個から2個選ぶのは ₅C₂＝10通り。`,
      calc:`2個とも白 : ₅C₂/₈C₂ = 10/28\n1 − 10/28 = 18/28 = 9/14`,
      tip:`「少なくとも」ときたら余事象を疑う。直接数えると「赤1個白1個」と「赤2個」に場合分けが必要になり、手数が増えてミスも増える。` },

    { id:"ka4", cat:"kakuritsu", d:2,
      q:`Aが的に当てる確率は2/3、Bが当てる確率は1/2である。2人が1回ずつ撃つとき、少なくとも一方が当たる確率はいくらか。`,
      c:["1/6","1/3","1/2","5/6","1"],
      a:3,
      e:`これも余事象。「少なくとも一方が当たる」の反対は「2人とも外す」。Aが外す確率は 1−2/3＝1/3、Bが外す確率は 1−1/2＝1/2。2人の結果は互いに影響しない（独立）ので掛け算する。`,
      calc:`2人とも外す : 1/3 × 1/2 = 1/6\n1 − 1/6 = 5/6`,
      tip:`独立な出来事が同時に起こる確率は掛け算。ここで 2/3＋1/2 と足すと1を超えてしまい、確率としてあり得ない値になる。` },

    { id:"ka5", cat:"kakuritsu", d:3,
      q:`10本のくじの中に当たりが3本ある。A、Bの順に1本ずつ引き、引いたくじは戻さない。Bが当たる確率はいくらか。`,
      c:["1/5","2/9","7/30","3/10","1/3"],
      a:3,
      e:`Aが当たった場合と外れた場合に分け、それぞれでBが当たる確率を求めて足す。Aが当たれば残り9本中当たり2本、Aが外れれば残り9本中当たり3本になる。計算すると3/10となり、1人目が当たる確率とまったく同じ値になる。`,
      calc:`Aが当たり : 3/10 × 2/9 = 6/90\nAが外れ　 : 7/10 × 3/9 = 21/90\n6/90 + 21/90 = 27/90 = 3/10`,
      tip:`くじは引く順番によって当たる確率が変わらない。これを知っていれば計算せずに3/10と即答できる。何番目に引いても有利不利はない。` },

    /* ── 割合と比 ─────────────────────────── */
    { id:"wa1", cat:"wariai", d:1,
      q:`ある品物の定価は原価の4割増しである。原価が2,500円のとき、定価はいくらか。`,
      c:["2,900円","3,000円","3,400円","3,500円","4,000円"],
      a:3,
      e:`「4割増し」は、もとの量に対してさらに0.4だけ多いということ、つまり1.4倍。割合の問題では「〜の」の前にある言葉が基準（もとにする量）で、ここでは原価が基準になっている。`,
      calc:`4割増し = 1 + 0.4 = 1.4 倍\n2,500 × 1.4 = 3,500 円`,
      tip:`割は0.1、分は0.01、厘は0.001。4割増しは1.4倍、4割引きは0.6倍。増しと引きを取り違えないこと。` },

    { id:"wa2", cat:"wariai", d:1,
      q:`ある学校の男子と女子の人数の比は5:4で、全体は270人である。男子は何人か。`,
      c:["120人","135人","144人","150人","162人"],
      a:3,
      e:`比の問題は「全体をいくつに分けるか」を先に出す。5:4なので全体は 5+4＝9等分でき、男子はそのうちの5つ分にあたる。`,
      calc:`比の合計 : 5 + 4 = 9\n270 × 5/9 = 150 人`,
      tip:`270÷9＝30 として1つぶんを先に出し、30×5＝150 と求めてもよい。女子は30×4＝120人で、合計が270人になることを検算できる。` },

    { id:"wa3", cat:"wariai", d:2,
      q:`ある学校の生徒の60%が男子で、その男子のうち25%が自転車通学である。自転車通学の男子は全体の何%か。`,
      c:["12%","15%","18%","20%","25%"],
      a:1,
      e:`基準が2段階になっている問題。自転車通学の男子は「全体の60%」の「さらに25%」なので、割合どうしを掛け合わせる。全体を100人と置いて、男子60人、そのうち25%の15人、と実数で追っても同じ答えになる。`,
      calc:`0.60 × 0.25 = 0.15 → 15 %\n[検算] 全体100人 → 男子60人 → 60×0.25 = 15人`,
      tip:`60%と25%を足して85%とするのは誤り。基準が違う割合どうしは足せない。迷ったら全体を100人と置いて実数で計算する。` },

    { id:"wa4", cat:"wariai", d:2,
      q:`A:B = 3:4、B:C = 2:5 であるとき、A:B:C はいくらか。`,
      c:["3:4:5","3:4:10","6:8:15","3:8:10","6:8:20"],
      a:1,
      e:`連比は、両方に共通するBの数字をそろえてつなぐ。A:B＝3:4 のBは4、B:C＝2:5 のBは2。後者を2倍して 4:10 にすればBが一致し、3つを並べられる。`,
      calc:`A : B = 3 : 4\nB : C = 2 : 5 = 4 : 10（2倍）\n→ A : B : C = 3 : 4 : 10`,
      tip:`共通する項の最小公倍数にそろえるのが基本。比は全体を同じ数で掛けても割っても変わらないので、片方だけ2倍しないよう注意する。` },

    { id:"wa5", cat:"wariai", d:2,
      q:`容器いっぱいに入っていた水を、1日目に全体の1/3、2日目に残りの1/4だけ使った。残っている水は全体のどれだけか。`,
      c:["1/3","5/12","1/2","7/12","2/3"],
      a:2,
      e:`2日目の「残りの1/4」は全体の1/4ではない。1日目が終わった時点の残り2/3が新しい基準になる。2日目に使ったのは 2/3×1/4＝1/6 で、これを2/3から引く。`,
      calc:`1日目後の残り : 1 − 1/3 = 2/3\n2日目の使用 : 2/3 × 1/4 = 1/6\n残り : 2/3 − 1/6 = 4/6 − 1/6 = 1/2`,
      tip:`「残りの」と書かれていたら基準が切り替わる合図。全体を12と置くと、1日目に4、残り8のうち2を使い、残り6＝全体の半分と確かめられる。` },

    /* ── 損益算 ───────────────────────────── */
    { id:"so1", cat:"soneki", d:1,
      q:`原価1,200円の商品に、原価の3割の利益を見込んで定価をつけた。定価はいくらか。`,
      c:["1,320円","1,440円","1,500円","1,560円","1,620円"],
      a:3,
      e:`損益算はまず「原価・定価・売価」を区別する。原価の3割の利益を見込むとは、原価に原価の0.3倍を足すこと、つまり原価の1.3倍を定価にすることを指す。`,
      calc:`1,200 × (1 + 0.3) = 1,200 × 1.3 = 1,560 円\n[利益] 1,560 − 1,200 = 360 = 1,200 × 0.3 ✓`,
      tip:`「原価の3割の利益」と「定価の3割引」は基準が違う。どちらを基準にした割合なのかを毎回確認する癖をつける。` },

    { id:"so2", cat:"soneki", d:1,
      q:`定価2,000円の商品を15%引きで販売した。売価はいくらか。`,
      c:["1,600円","1,650円","1,700円","1,750円","1,850円"],
      a:2,
      e:`15%引きは、定価の (100−15)%＝85% を支払うということ。引く額300円を先に出して引いてもよいが、0.85倍と一度に計算するほうが速い。`,
      calc:`2,000 × (1 − 0.15) = 2,000 × 0.85 = 1,700 円`,
      tip:`「◯%引き」は (1−◯/100) 倍。2割引なら0.8倍、3割引なら0.7倍とすぐ変換できるようにしておくと、複数の割引が重なる問題で効いてくる。` },

    { id:"so3", cat:"soneki", d:2,
      q:`原価800円の商品に定価をつけたところ、定価の2割引で売っても原価の1割の利益が出た。定価はいくらか。`,
      c:["1,000円","1,050円","1,100円","1,120円","1,200円"],
      a:2,
      e:`逆算の問題なので、確実に分かるところから埋める。まず売価は、原価の1割の利益が出たので 800×1.1＝880円。この880円が「定価の2割引」、つまり定価の0.8倍にあたるので、880を0.8で割れば定価が出る。`,
      calc:`売価 = 800 × 1.1 = 880 円\n定価 × 0.8 = 880\n定価 = 880 ÷ 0.8 = 1,100 円\n[検算] 1,100 × 0.8 = 880 ✓`,
      tip:`定価をdと置いて 0.8d＝880 と方程式にしてもよい。損益算は「原価→売価→定価」のように、分かるところから順に埋めていくと迷わない。` },

    { id:"so4", cat:"soneki", d:1,
      q:`ある商品を1,500円で仕入れ、2,100円で売った。原価に対する利益の割合は何%か。`,
      c:["28.6%","30%","35%","40%","60%"],
      a:3,
      e:`利益率は「利益が原価の何倍にあたるか」を表す割合。まず利益そのものを出す必要があるので、売価から原価を引いて600円。これを基準である原価1,500円で割ると0.4となり、百分率に直して40%となる。`,
      calc:`利益 = 2,100 − 1,500 = 600 円\n600 ÷ 1,500 = 0.4 → 40 %`,
      tip:`売価で割ると 600÷2,100≒28.6% となり、これは別の指標（売上高に対する利益率）。SPIで単に「利益率」とあれば原価が基準と考える。` },

    { id:"so5", cat:"soneki", d:3,
      q:`原価の4割増しの定価をつけたが売れなかったので、定価の3割引で売ったところ160円の損失となった。原価はいくらか。`,
      c:["4,000円","5,000円","6,400円","8,000円","10,000円"],
      a:3,
      e:`原価が分からないので、原価を1として売価が何倍になるかを追う。定価は原価の1.4倍、その3割引なので売価は 1.4×0.7＝0.98倍。原価より0.02倍ぶん少なく、この0.02倍が160円の損失にあたる。`,
      calc:`売価 = 原価 × 1.4 × 0.7 = 原価 × 0.98\n損失 = 原価 × (1 − 0.98) = 原価 × 0.02\n原価 × 0.02 = 160\n原価 = 160 ÷ 0.02 = 8,000 円`,
      tip:`「4割増しの3割引」は 1.4−0.3＝1.1倍ではない。増しと引きは掛け合わせる。0.98倍なので、この売り方では必ずわずかに損が出る。` },

    /* ── 仕事算 ───────────────────────────── */
    { id:"si1", cat:"shigoto", d:1,
      q:`ある仕事をAだけで行うと12日、Bだけで行うと6日かかる。2人が一緒に行うと何日かかるか。`,
      c:["4日","5日","6日","9日","18日"],
      a:0,
      e:`仕事算は全体の仕事量を1と置くのが基本。Aは1日に1/12、Bは1日に1/6を終える。2人で働けば1日あたりの仕事量は足し算になり、全体1をその値で割れば必要な日数が出る。`,
      calc:`1日あたり : 1/12 + 1/6 = 1/12 + 2/12 = 3/12 = 1/4\n1 ÷ 1/4 = 4 日`,
      tip:`最後に「1 ÷ 1日あたりの仕事量」で割り戻すのを忘れやすい。1/4を答えにしないこと。また12と6を平均して9日とするのも誤り。` },

    { id:"si2", cat:"shigoto", d:2,
      q:`ある仕事をAだけで行うと20日かかり、AとBの2人で行うと12日かかる。Bだけで行うと何日かかるか。`,
      c:["24日","28日","30日","32日","36日"],
      a:2,
      e:`引き算で求める型。2人合わせた1日の仕事量1/12から、Aの1日ぶん1/20を引けば、Bの1日ぶんが残る。通分して計算し、最後に逆数をとる。`,
      calc:`Bの1日ぶん : 1/12 − 1/20\n= 5/60 − 3/60 = 2/60 = 1/30\n1 ÷ 1/30 = 30 日`,
      tip:`分数の引き算は分母をそろえてから。20−12＝8日としないこと。日数そのものは足したり引いたりできない。` },

    { id:"si3", cat:"shigoto", d:2,
      q:`ある仕事を、まずAが6日行い、続けてBが8日行って完成した。この仕事をAだけで行うと10日かかる。Bだけで行うと何日かかるか。`,
      c:["12日","16日","18日","20日","24日"],
      a:3,
      e:`全体を1として、先に働いたAの仕事量を確定させる。Aは1日1/10なので6日で 6/10＝3/5。残る2/5をBが8日で終えたので、Bの1日ぶんは 2/5÷8＝1/20。`,
      calc:`Aの仕事量 : 6 × 1/10 = 3/5\n残り : 1 − 3/5 = 2/5\nBの1日ぶん : 2/5 ÷ 8 = 1/20\n1 ÷ 1/20 = 20 日`,
      tip:`「Aが◯日、続けてBが△日」型は、先に働いた人の仕事量を出して全体から引くのが定石。2人が同時に働いているわけではない点に注意する。` },

    { id:"si4", cat:"shigoto", d:1,
      q:`空の水槽を満たすのに、A管だけでは30分、B管だけでは20分かかる。両方を同時に使うと何分かかるか。`,
      c:["10分","12分","15分","18分","25分"],
      a:1,
      e:`水槽やポンプの問題も仕事算とまったく同じ構造。満水を1として、A管は1分で1/30、B管は1分で1/20を入れる。同時に使えば1分あたりの量は足し算になる。`,
      calc:`1分あたり : 1/30 + 1/20 = 2/60 + 3/60 = 5/60 = 1/12\n1 ÷ 1/12 = 12 分`,
      tip:`排水管が混ざる問題では、入れる量を＋、抜く量を−として足し合わせる。答えは必ず、単独で最も速い管の時間より短くなる。` },

    { id:"si5", cat:"shigoto", d:2,
      q:`12人で行うと15日かかる仕事がある。これを9日で終わらせるには何人必要か。`,
      c:["16人","18人","20人","22人","24人"],
      a:2,
      e:`「人数×日数」で表した延べ仕事量は、人数が変わっても一定。12人×15日＝180人日が全体の仕事量なので、これを9日で割れば必要な人数が出る。`,
      calc:`全体 : 12 × 15 = 180 人日\n180 ÷ 9 = 20 人`,
      tip:`人数と日数は反比例する。日数が15日から9日へ 9/15＝3/5 になるので、人数は逆に5/3倍。12×5/3＝20人と考えても同じ。` },

    /* ── 速さ ─────────────────────────────── */
    { id:"ha1", cat:"hayasa", d:1,
      q:`時速72kmは秒速何mか。`,
      c:["12m","15m","18m","20m","24m"],
      a:3,
      e:`単位の変換。1km＝1,000m、1時間＝3,600秒なので、時速の数値に1,000を掛けて3,600で割る。1,000/3,600＝1/3.6 なので、時速を3.6で割れば秒速になる。`,
      calc:`72 × 1,000 ÷ 3,600 = 20 m/秒\n[別解] 72 ÷ 3.6 = 20`,
      tip:`時速72km＝秒速20mは通過算でよく出るので覚えておくと速い。逆に秒速から時速へは3.6倍する。` },

    { id:"ha2", cat:"hayasa", d:1,
      q:`家から駅までの1.8kmの道のりを、分速60mで歩いた。何分かかるか。`,
      c:["18分","24分","30分","36分","45分"],
      a:2,
      e:`「時間＝道のり÷速さ」。ただし道のりがkm、速さが分速mなので、まず1.8kmを1,800mに直して単位をそろえてから割る。`,
      calc:`1.8 km = 1,800 m\n1,800 ÷ 60 = 30 分`,
      tip:`速さの問題は計算より先に単位をそろえる。kmとm、時間と分が混ざったまま割ると必ず間違える。` },

    { id:"ha3", cat:"hayasa", d:2,
      q:`長さ150mの列車が時速72kmで走り、長さ250mの鉄橋を渡り始めてから渡り終わるまでに何秒かかるか。`,
      c:["12.5秒","15秒","20秒","25秒","30秒"],
      a:2,
      e:`通過算では「列車の先頭が渡り始めてから、最後尾が渡り終わるまで」を考える。そのあいだに列車が進む距離は、橋の長さ250mに列車自身の長さ150mを足した400m。速さを秒速に直してから割る。`,
      calc:`速さ : 72 km/h = 20 m/秒\n距離 : 250 + 150 = 400 m\n400 ÷ 20 = 20 秒`,
      tip:`「渡り終わる」なら橋＋列車、「完全に橋の上にいる」なら橋−列車。すれ違いや追い越しでは2つの列車の長さの和を使う。` },

    { id:"ha4", cat:"hayasa", d:3,
      q:`A地点からB地点まで、行きは時速40km、帰りは時速60kmで往復した。往復の平均の速さは時速何kmか。`,
      c:["時速45km","時速48km","時速50km","時速52km","時速55km"],
      a:1,
      e:`平均の速さは、速さどうしを平均するのではなく「全体の道のり ÷ 全体の時間」で求める。片道の距離が分からないので、40と60の公倍数である120kmと仮に置くと分数が出ずに計算できる。行き3時間、帰り2時間で合計5時間、往復240kmになる。`,
      calc:`片道120kmと仮定\n行き : 120 ÷ 40 = 3 時間\n帰り : 120 ÷ 60 = 2 時間\n240 ÷ 5 = 時速 48 km`,
      tip:`単純平均の50km/hは誤り。遅いほうに長く時間がかかるぶん、平均は必ず単純平均より小さくなる。距離は速さの公倍数で置くのがコツ。` },

    { id:"ha5", cat:"hayasa", d:2,
      q:`弟が分速60mで家を出た。その10分後に兄が分速80mで同じ道を追いかけた。兄が弟に追いつくのは、兄が出発してから何分後か。`,
      c:["20分後","25分後","30分後","35分後","40分後"],
      a:2,
      e:`追いかけ算。兄が出発した時点で、弟はすでに 60×10＝600m 先にいる。2人の速さの差は毎分20mなので、1分ごとに差が20mずつ縮まる。600mの差を20m/分で割れば追いつくまでの時間が出る。`,
      calc:`最初の差 : 60 × 10 = 600 m\n1分に縮む差 : 80 − 60 = 20 m\n600 ÷ 20 = 30 分後\n[検算] 兄 80×30 = 2,400m、弟 60×40 = 2,400m ✓`,
      tip:`追いかけは「差÷速さの差」、出会いは「距離の和÷速さの和」。問われているのが「兄が出発してから」か「弟が出発してから」かも読み違えやすい。` },

    /* ── 集合 ─────────────────────────────── */
    { id:"sh1", cat:"shugo", d:2,
      q:`100人にアンケートをとったところ、犬を飼っている人が45人、猫を飼っている人が38人、どちらも飼っていない人が32人だった。両方飼っている人は何人か。`,
      c:["7人","12人","15人","17人","20人"],
      a:2,
      e:`ベン図で考える。まず「少なくとも一方を飼っている人」は、全体からどちらも飼っていない人を引いて68人。一方、犬45人と猫38人を単純に足すと83人になるが、これは両方飼っている人を2回数えている。83と68の差が、その重なりぶんにあたる。`,
      calc:`少なくとも一方 : 100 − 32 = 68 人\n45 + 38 = 83\n83 − 68 = 15 人`,
      tip:`公式は「AまたはB ＝ A ＋ B − AかつB」。全体からどちらでもない人を引いて和集合を出す手順を先にすると、式の当てはめで迷わない。` },

    { id:"sh2", cat:"shugo", d:1,
      q:`50人の生徒のうち、英語が好きな人が30人、数学が好きな人が25人、両方好きな人が12人である。どちらも好きでない人は何人か。`,
      c:["5人","7人","9人","10人","13人"],
      a:1,
      e:`先に「英語または数学が好きな人」を求める。30＋25では両方好きな12人を2回数えているので、1回ぶん引いて43人。全体50人からこれを引けば、どちらも好きでない人が出る。`,
      calc:`どちらか好き : 30 + 25 − 12 = 43 人\n50 − 43 = 7 人`,
      tip:`足して引くだけの基本形。図を描いて、重なりの部分をちょうど1回だけ数えていることを確認する。` },

    { id:"sh3", cat:"shugo", d:1,
      q:`200人にアンケートしたところ、商品Aを知っている人が120人、商品Bを知っている人が90人、両方を知っている人が40人だった。Aだけを知っている人は何人か。`,
      c:["50人","60人","70人","80人","90人"],
      a:3,
      e:`「Aだけ」は、Aを知っている人全体から、AもBも知っている人を除いた部分。ベン図では左側の三日月の部分にあたる。全体の200人という数字はこの問いには使わない。`,
      calc:`120 − 40 = 80 人`,
      tip:`問題文の「だけ」「のみ」を見落とさない。ちなみにBだけは 90−40＝50人で、少なくとも一方を知っているのは 80+50+40＝170人。` },

    { id:"sh4", cat:"shugo", d:3,
      q:`100人のうち、A紙を購読している人が62人、B紙を購読している人が45人である。両方購読している人は、最も少なくて何人か。`,
      c:["7人","17人","28人","38人","45人"],
      a:0,
      e:`重なりが最も小さくなるのは、2つの集合ができるだけ重ならないように広がったとき、つまり和集合が全体100人いっぱいになるとき。62＋45＝107人ぶんの購読があるのに人は100人しかいないので、107−100＝7人はどうしても重ならざるを得ない。`,
      calc:`62 + 45 = 107（延べ人数）\n107 − 100 = 7 人`,
      tip:`逆に「最も多い場合」は、小さいほうの集合がすっぽり含まれるときで45人。最小は「A＋B−全体」、最大は「小さいほうの人数」と覚える。` },

    { id:"sh5", cat:"shugo", d:1,
      q:`40人のクラスで、兄がいる人が18人、姉がいる人が15人、兄と姉の両方がいる人が6人である。兄も姉もいない人は何人か。`,
      c:["7人","10人","13人","16人","19人"],
      a:2,
      e:`兄または姉がいる人を求めてから、全体40人から引く。18＋15では両方いる6人を重複して数えているので、1回ぶん引いて27人。`,
      calc:`兄または姉 : 18 + 15 − 6 = 27 人\n40 − 27 = 13 人`,
      tip:`「A・B・両方」の3つの数字が与えられたら、まず和集合を出すのが定石。そこから全体を引くか、部分を取り出すかは設問次第。` },

    /* ── 表の読み取り ─────────────────────── */
    { id:"hy1", cat:"hyou", d:1, table:SALES_TABLE,
      q:`A店の2024年の売上は、前年に比べて何%増加したか。`,
      c:["12%","13%","15%","18%","20%"],
      a:2,
      e:`増加率は「増加額 ÷ もとにする量」。もとにするのは前年である2023年の売上1,200万円。増加額は 1,380−1,200＝180万円なので、180を1,200で割る。`,
      calc:`増加額 : 1,380 − 1,200 = 180\n180 ÷ 1,200 = 0.15 → 15 %`,
      tip:`資料解釈では「何に対する割合か」を必ず確認する。2024年の1,380で割ると約13%となり、選択肢に用意された引っかけに当たる。` },

    { id:"hy2", cat:"hyou", d:1, table:SALES_TABLE,
      q:`2024年の4店舗の売上合計はいくらか。`,
      c:["4,050万円","4,230万円","4,350万円","4,470万円","4,530万円"],
      a:4,
      e:`2024年の列にある4つの数値を足すだけの問題。ただし桁が多いので、位をそろえて2つずつ足していくと計算違いを防げる。810と690、1,380と1,650のように、足すと切りのよい数になる組から先に処理するのも有効。`,
      calc:`1,380 + 810 = 2,190\n2,190 + 1,650 = 3,840\n3,840 + 690 = 4,530 万円`,
      tip:`表の問題では、まず単位（ここでは万円）と、どの列を見るのかを確認してから計算に入る。年をまたいで足してしまう読み違いが起きやすい。` },

    { id:"hy3", cat:"hyou", d:2, table:SALES_TABLE,
      q:`2024年の売上が前年より減少した店舗がある。その店舗の減少率は何%か。`,
      c:["8%","9%","10%","11%","12%"],
      a:2,
      e:`4店舗のうち、2024年の数値が2023年より小さいのはB店だけ（900→810）。減少率も基準は前年なので、減少額90を前年の900で割る。`,
      calc:`減少している店舗 : B店（900 → 810）\n減少額 : 900 − 810 = 90\n90 ÷ 900 = 0.10 → 10 %`,
      tip:`まず全店の増減を目で見比べて対象を1つに絞り、それから計算に入るのが速い。810で割ると約11%となり誤り。` },

    { id:"hy4", cat:"hyou", d:2, table:SALES_TABLE,
      q:`2024年の4店舗の売上合計に占めるC店の割合は、およそ何%か。`,
      c:["約30%","約33%","約36%","約40%","約44%"],
      a:2,
      e:`構成比は「その項目 ÷ 全体」。全体は4店舗の合計4,530万円。1,650÷4,530 を計算すると0.364となる。設問が「およそ」なので、細かく割り切らず概算でよい。`,
      calc:`1,650 ÷ 4,530 ≒ 0.364 → 約 36 %\n[概算] 4,530を約4,500とみて 1,650/4,500 ≒ 0.367`,
      tip:`概算のコツは、分母をきりのよい数に丸めて当たりをつけること。選択肢が3%以上離れていれば、丸めても答えは1つに決まる。` },

    { id:"hy5", cat:"hyou", d:2, table:SALES_TABLE,
      q:`2023年から2024年にかけて、売上の増加額が最も大きかった店舗はどれか。`,
      c:["A店","B店","C店","D店","A店とC店で同じ"],
      a:0,
      e:`問われているのは増加「額」であって増加「率」ではない。各店の差を順に取ると、A＋180、B−90、C＋150、D＋90（万円）。最大はA店。`,
      calc:`A : 1,380 − 1,200 = +180\nB : 810 − 900 = −90\nC : 1,650 − 1,500 = +150\nD : 690 − 600 = +90\n→ 最大は A店`,
      tip:`増加率で比べるとA店15%、C店10%、D店15%となり、A店とD店が並ぶ。額と率のどちらを問われているかで答えが変わるので、設問の言葉を必ず確認する。` },

    /* ── 料金の割引 ───────────────────────── */
    { id:"wb1", cat:"waribiki", d:2,
      q:`ある施設の入場料は1人800円だが、20人を超えた分については2割引になる。35人で入場したときの合計金額はいくらか。`,
      c:["22,400円","24,000円","25,600円","26,400円","28,000円"],
      a:2,
      e:`割引が全員に適用されるわけではない点が急所。最初の20人は定価800円のまま、20人を超えた15人ぶんだけが2割引の640円になる。それぞれ計算して足す。`,
      calc:`定価の20人 : 20 × 800 = 16,000 円\n割引の15人 : 800 × 0.8 = 640 → 15 × 640 = 9,600 円\n16,000 + 9,600 = 25,600 円`,
      tip:`「◯人を超えた分について」は超過分だけが対象。35人全員を640円にすると22,400円となり、これも選択肢に用意されている。` },

    { id:"wb2", cat:"waribiki", d:1,
      q:`あるサービスは基本料金1,500円で、10回を超えた利用1回につき200円が加算される。18回利用したときの料金はいくらか。`,
      c:["2,600円","3,100円","3,300円","3,600円","5,100円"],
      a:1,
      e:`段階制の料金では、基本料金に超過したぶんだけを加算する。加算の対象は18回のうち10回を超えた8回ぶんで、最初の10回には追加料金がかからない。8回ぶんの加算額を求めてから基本料金に足す。`,
      calc:`超過回数 : 18 − 10 = 8 回\n8 × 200 = 1,600 円\n1,500 + 1,600 = 3,100 円`,
      tip:`「10回を超えた分」なので11回目から数える。18回すべてに200円を掛けると5,100円となり、これも選択肢に置かれている。` },

    { id:"wb3", cat:"waribiki", d:1,
      q:`定価1,200円の本は、3冊以上まとめて買うと合計金額から15%引きになる。5冊買うといくらか。`,
      c:["4,800円","5,100円","5,280円","5,400円","5,700円"],
      a:1,
      e:`この割引は「3冊以上なら合計金額から15%引き」なので、まず定価で合計を出し、その全体に0.85を掛ける。1冊ずつ割り引いてから足しても結果は同じ。`,
      calc:`1,200 × 5 = 6,000 円\n6,000 × 0.85 = 5,100 円`,
      tip:`「3冊を超えた分だけ割引」と書かれていれば計算が変わり、2冊は定価・3冊ぶんが割引になる。全体にかかるのか超過分だけなのかを読み分ける。` },

    { id:"wb4", cat:"waribiki", d:2,
      q:`ある団体料金は、30人までは1人1,000円、31人目からは1人700円である。48人の団体の合計金額はいくらか。`,
      c:["33,600円","38,400円","41,400円","42,600円","48,000円"],
      a:3,
      e:`段階料金の問題。30人までの部分と31人目からの部分に分け、それぞれ別の単価で計算してから足す。48人なら、1,000円が適用される30人ぶんと、700円が適用される18人ぶんに分かれる。`,
      calc:`30人まで : 30 × 1,000 = 30,000 円\n超過18人 : 48 − 30 = 18 → 18 × 700 = 12,600 円\n30,000 + 12,600 = 42,600 円`,
      tip:`全員を700円にすると33,600円、全員を1,000円にすると48,000円で、どちらも選択肢にある。区切りの人数をどちらの単価で数えるかを正確に。` },

    { id:"wb5", cat:"waribiki", d:3,
      q:`ある施設は、会員なら年会費3,000円を払ったうえで1回600円、非会員は1回1,000円で利用できる。年に何回以上利用すると、会員のほうが安くなるか。`,
      c:["6回","7回","8回","9回","10回"],
      a:2,
      e:`利用回数をn回と置いて不等式を立てる。会員の年間費用は 3,000＋600n 円、非会員は 1,000n 円。会員のほうが安いのは 3,000＋600n＜1,000n のとき。整理すると n＞7.5 となるが、回数は整数なので8回以上。`,
      calc:`3,000 + 600n ＜ 1,000n\n3,000 ＜ 400n\nn ＞ 7.5 → 8 回以上\n[検算] 7回 : 会員7,200 / 非会員7,000（非会員が安い）\n　　　 8回 : 会員7,800 / 非会員8,000（会員が安い）`,
      tip:`7.5回ちょうどで両者は同額になる。「より安くなる」なら8回以上だが、「損をしない（同額でもよい）」なら境目の扱いが変わる。設問の言葉を確認する。` },

    /* ── 分割払い・精算 ───────────────────── */
    { id:"bu1", cat:"bunkatsu", d:1,
      q:`30万円の商品を、頭金として代金の1/5を支払い、残額を10回の均等分割で支払う。1回あたりの支払額はいくらか。`,
      c:["20,000円","24,000円","25,000円","28,000円","30,000円"],
      a:1,
      e:`頭金を先に払い、残った額だけを分割する。頭金は 300,000×1/5＝60,000円、残額は240,000円。これを10回で割る。`,
      calc:`頭金 : 300,000 × 1/5 = 60,000 円\n残額 : 300,000 − 60,000 = 240,000 円\n240,000 ÷ 10 = 24,000 円`,
      tip:`代金全体を10で割って30,000円としないこと。分割の対象は必ず「頭金を引いた残額」。` },

    { id:"bu2", cat:"bunkatsu", d:3,
      q:`A、B、Cの3人で旅行し、Aが宿泊費36,000円、Bが交通費21,000円、Cが食費9,000円を立て替えた。費用を3人で均等に負担するとき、CはAにいくら払えばよいか（BもAに不足分を払うものとする）。`,
      c:["9,000円","11,000円","13,000円","14,000円","22,000円"],
      a:2,
      e:`立替精算は「1人あたりの負担額」を先に出す。合計66,000円を3人で割ると1人22,000円。これと各自の立替額を比べると、Aは14,000円の払い過ぎ、Bは1,000円の不足、Cは13,000円の不足。不足している人が払い過ぎている人へ渡せばよい。`,
      calc:`合計 : 36,000 + 21,000 + 9,000 = 66,000 円\n1人あたり : 66,000 ÷ 3 = 22,000 円\nA : 36,000 − 22,000 = +14,000（受け取る）\nB : 21,000 − 22,000 = −1,000（払う）\nC : 9,000 − 22,000 = −13,000（払う）\n→ C は A へ 13,000 円`,
      tip:`検算はAが受け取る額でする。CからA13,000円、BからA1,000円で合計14,000円となり、Aの払い過ぎ分とちょうど一致する。` },

    { id:"bu3", cat:"bunkatsu", d:2,
      q:`代金の1/3を頭金として支払い、残額を6回の均等分割で支払う。1回あたりの支払額は代金全体のどれだけにあたるか。`,
      c:["1/6","1/8","1/9","1/12","2/9"],
      a:2,
      e:`金額が与えられていないので、代金全体を1として分数で追う。頭金1/3を除いた残額は 1−1/3＝2/3。これを6回に均等に割るので、2/3÷6 を計算する。`,
      calc:`残額 : 1 − 1/3 = 2/3\n1回ぶん : 2/3 ÷ 6 = 2/3 × 1/6 = 2/18 = 1/9`,
      tip:`分数の割り算は逆数を掛ける。代金を18と置くと、頭金6、残額12、1回2で、全体18に対する1/9と具体的に確かめられる。` },

    { id:"bu4", cat:"bunkatsu", d:2,
      q:`ある品物を、頭金として代金の20%を支払い、残りを月々12,000円ずつ8回で払い終えた。この品物の代金はいくらか。`,
      c:["96,000円","108,000円","115,200円","120,000円","144,000円"],
      a:3,
      e:`逆算の問題。分割で支払った総額は 12,000×8＝96,000円で、これは頭金20%を除いた残り80%にあたる。96,000を0.8で割れば代金全体が出る。`,
      calc:`分割の総額 : 12,000 × 8 = 96,000 円（＝代金の80%）\n代金 : 96,000 ÷ 0.8 = 120,000 円\n[検算] 頭金 120,000 × 0.2 = 24,000、24,000 + 96,000 = 120,000 ✓`,
      tip:`96,000円を代金そのものと読み違えやすい。頭金を含めた全体を聞かれているのか、残額を聞かれているのかを確認する。` },

    { id:"bu5", cat:"bunkatsu", d:2,
      q:`4人で食事をし、合計代金は18,400円だった。幹事が他の3人より2,000円多く負担するとき、幹事以外の3人は1人いくら払うことになるか。`,
      c:["3,600円","4,100円","4,300円","4,600円","5,100円"],
      a:1,
      e:`幹事以外の3人の負担額をy円と置くと、幹事はそれより2,000円多い y+2,000円になる。この4人ぶんを合計すると18,400円になるので、1本の方程式にまとめてyを求める。`,
      calc:`3y + (y + 2,000) = 18,400\n4y = 16,400\ny = 4,100 円\n[検算] 4,100 × 3 + 6,100 = 18,400 ✓`,
      tip:`先に幹事の追加分2,000円を総額から引き、16,400円を4人で均等に割って4,100円と求めてもよい。このとき幹事は6,100円。` },

    /* ── 濃度算 ───────────────────────────── */
    { id:"no1", cat:"noudo", d:1,
      q:`8%の食塩水300gに含まれる食塩は何gか。`,
      c:["16g","21g","24g","27g","30g"],
      a:2,
      e:`食塩水の問題は「食塩の重さ＝食塩水の重さ×濃度」が基本式。ここでは食塩水300gと濃度8%が与えられているので、300に0.08を掛ければ食塩の重さが出る。残りの276gが水の重さにあたる。`,
      calc:`300 × 0.08 = 24 g\n（水は 300 − 24 = 276 g）`,
      tip:`濃度の分母は食塩水全体（食塩＋水）であって、水の重さではない。この基本を外すと以降の問題がすべてずれる。` },

    { id:"no2", cat:"noudo", d:1,
      q:`6%の食塩水200gに水を100g加えると、濃度は何%になるか。`,
      c:["2%","3%","4%","4.5%","5%"],
      a:2,
      e:`水を加えても、中に入っている食塩の量は変わらない。変わるのは全体の重さだけ。食塩12gをそのままに、分母を 200+100＝300g にして割り直す。`,
      calc:`食塩 : 200 × 0.06 = 12 g（加水後も変わらない）\n全体 : 200 + 100 = 300 g\n12 ÷ 300 = 0.04 → 4 %`,
      tip:`濃度算は「食塩の量は変わらない」を軸にすると迷わない。水を加えれば薄まり、蒸発させれば濃くなる。6%の半分の3%とはならない点に注意。` },

    { id:"no3", cat:"noudo", d:2,
      q:`10%の食塩水150gと4%の食塩水250gを混ぜると、濃度は何%になるか。`,
      c:["5.5%","6%","6.25%","6.5%","7%"],
      a:2,
      e:`混ぜる問題は、食塩の量と食塩水の量をそれぞれ合計してから割る。10%の150gには15g、4%の250gには10gの食塩が入っている。`,
      calc:`食塩 : 150 × 0.10 = 15 g\n　　　 250 × 0.04 = 10 g\n合計 : 食塩 25 g / 全体 400 g\n25 ÷ 400 = 0.0625 → 6.25 %`,
      tip:`(10+4)÷2＝7% とするのは誤り。重さが違うので、量の多い側の濃度に引っ張られる。ここは4%側が250gと多いため、7%より低くなる。` },

    { id:"no4", cat:"noudo", d:3,
      q:`12%の食塩水400gから水を何g蒸発させると、16%の食塩水になるか。`,
      c:["50g","80g","100g","120g","150g"],
      a:2,
      e:`蒸発するのは水だけなので、食塩48gは最初から最後まで変わらない。その48gが全体の16%にあたる状態を考えると、全体は 48÷0.16＝300g。もとの400gとの差が、蒸発した水の量になる。`,
      calc:`食塩 : 400 × 0.12 = 48 g（変わらない）\n16%のときの全体 : 48 ÷ 0.16 = 300 g\n蒸発量 : 400 − 300 = 100 g`,
      tip:`変わらない量（食塩）を固定して、全体の重さを逆算するのが定石。400×0.16 のように直接計算しようとすると行き詰まる。` },

    { id:"no5", cat:"noudo", d:3,
      q:`4%の食塩水400gに食塩を何g加えると、20%の食塩水になるか。`,
      c:["60g","64g","72g","80g","96g"],
      a:3,
      e:`加えるのが水ではなく食塩なので、食塩の量も全体の重さも同じだけ増える。加える量をxgとすると、食塩は16+x、全体は400+x。この比が0.2になる方程式を立てて解く。`,
      calc:`もとの食塩 : 400 × 0.04 = 16 g\n(16 + x) ÷ (400 + x) = 0.2\n16 + x = 0.2 × (400 + x) = 80 + 0.2x\n0.8x = 64 → x = 80 g\n[検算] 96 ÷ 480 = 0.2 ✓`,
      tip:`分母の (400+x) の x を忘れて (16+x)÷400＝0.2 としてしまうのが最頻出のミス。加えたものは全体の重さにも入る。` },

    /* ── 年齢算 ───────────────────────────── */
    { id:"ne1", cat:"nenrei", d:2,
      q:`現在、父は40歳、子は10歳である。父の年齢が子の年齢の3倍になるのは何年後か。`,
      c:["5年後","6年後","8年後","10年後","15年後"],
      a:0,
      e:`年齢算は、x年後には全員が同じくx歳ずつ増えることを式にする。x年後の父は40+x歳、子は10+x歳。これが3倍の関係になるので 40+x＝3(10+x) と立てて解く。`,
      calc:`40 + x = 3 × (10 + x)\n40 + x = 30 + 3x\n2x = 10 → x = 5\n[検算] 5年後 父45歳・子15歳 → 45 = 15 × 3 ✓`,
      tip:`年齢の差は何年たっても変わらない（ここでは常に30歳差）。3倍になるとき、差30歳は子の2つ分にあたるので子は15歳、つまり5年後と暗算でも出せる。` },

    { id:"ne2", cat:"nenrei", d:1,
      q:`現在、兄は15歳、弟は9歳である。2人の年齢の和が40歳になるのは何年後か。`,
      c:["4年後","6年後","8年後","10年後","12年後"],
      a:2,
      e:`2人ぶんなので、1年たつごとに年齢の和は2ずつ増える。現在の和24歳から40歳までの差16を、1年あたりの増加2で割る。`,
      calc:`現在の和 : 15 + 9 = 24 歳\n40 − 24 = 16\n16 ÷ 2 = 8 年後\n[検算] 8年後 23歳 + 17歳 = 40 ✓`,
      tip:`人数が増えれば1年あたりの増え方も増える。3人なら1年で3ずつ、4人なら4ずつ増える。人数を数え違えないこと。` },

    { id:"ne3", cat:"nenrei", d:3,
      q:`現在、父の年齢は子の年齢の4倍で、12年後には2倍になる。現在の子の年齢は何歳か。`,
      c:["3歳","4歳","5歳","6歳","8歳"],
      a:3,
      e:`現在の子の年齢をc歳と置くと、父は4c歳。12年後は子がc+12歳、父が4c+12歳になり、これが2倍の関係。式を整理するとcが求まる。`,
      calc:`4c + 12 = 2 × (c + 12)\n4c + 12 = 2c + 24\n2c = 12 → c = 6\n[検算] 現在 6歳・24歳 → 12年後 18歳・36歳 = 2倍 ✓`,
      tip:`年齢差は変わらないという性質でも解ける。差3cは12年後には子(c+12)の1つ分にあたるので 3c＝c+12 となり、同じくc＝6が出る。` },

    { id:"ne4", cat:"nenrei", d:3,
      q:`現在、父は48歳、3人の子はそれぞれ15歳、12歳、9歳である。父の年齢が3人の子の年齢の合計と等しくなるのは何年後か。`,
      c:["4年後","6年後","9年後","12年後","18年後"],
      a:1,
      e:`子が3人いるので、1年で子の合計は3ずつ増えるのに対し、父は1しか増えない。現在は父48歳・子の合計36歳で12歳の差があり、この差が1年に2ずつ縮まっていく。`,
      calc:`子の合計 : 15 + 12 + 9 = 36 歳\n48 + x = 36 + 3x\n2x = 12 → x = 6\n[検算] 6年後 父54歳、子 21+18+15 = 54 ✓`,
      tip:`「差が1年にいくつ縮まるか」を見るのが速い。人数の違う年齢算では、増える速さの差（ここでは3−1＝2）を必ず確認する。` },

    { id:"ne5", cat:"nenrei", d:2,
      q:`現在、Aの年齢はBの年齢の2倍である。5年前、AはBの年齢の3倍だった。現在のAは何歳か。`,
      c:["8歳","10歳","12歳","15歳","20歳"],
      a:4,
      e:`現在のBをb歳と置くとAは2b歳。5年前は両方から5を引いて、Aが2b−5歳、Bがb−5歳。これが3倍の関係になるので式を立てる。`,
      calc:`2b − 5 = 3 × (b − 5)\n2b − 5 = 3b − 15\nb = 10 → A = 2b = 20 歳\n[検算] 5年前 A15歳・B5歳 → 15 = 5 × 3 ✓`,
      tip:`「5年前」は引き算、「5年後」は足し算。過去を扱う問題では、年齢が0以下にならないかも確かめる。` },

    /* ── 植木算 ───────────────────────────── */
    { id:"ue1", cat:"ueki", d:1,
      q:`長さ120mのまっすぐな道路に、端から端まで6mおきに木を植える。木は何本必要か。`,
      c:["16本","19本","20本","21本","24本"],
      a:3,
      e:`まず間隔の数を求める。120÷6＝20 で、道は20区間に分かれる。両端に木を植える直線では、区切りの点は区間の数より1つ多いので、木は21本になる。`,
      calc:`間隔の数 : 120 ÷ 6 = 20\n木の本数 : 20 + 1 = 21 本`,
      tip:`「両端に植える直線」は 本数＝間隔＋1。3〜4本の小さい例を図に描いて確かめる習慣をつけると取り違えない。` },

    { id:"ue2", cat:"ueki", d:1,
      q:`1周180mの円形の池のまわりに、9mおきに木を植える。木は何本必要か。`,
      c:["18本","19本","20本","21本","22本"],
      a:2,
      e:`円形に植える場合は、一周して戻ってきた地点が出発点の木と重なる。そのため区間の数と木の本数がちょうど一致し、直線のときのように1を足す必要がない。180÷9 で区間の数を出せば、それがそのまま答えになる。`,
      calc:`180 ÷ 9 = 20\n円形なので 木の本数 = 間隔の数 = 20 本`,
      tip:`直線（両端に植える）は＋1、円形は±0、両端に植えない場合は−1。この3つを区別できれば植木算はほぼ落とさない。` },

    { id:"ue3", cat:"ueki", d:2,
      q:`長さ100mの道の両側に、両端を含めて5mおきに木を植える。木は全部で何本必要か。`,
      c:["20本","21本","40本","41本","42本"],
      a:4,
      e:`二段階の問題。まず片側だけを考えると、100÷5＝20区間に分かれ、両端に植えるので木は21本。道の両側に植えるので、この21本を2倍する。片側を完成させてから2倍する、という順序が大事。`,
      calc:`片側の間隔 : 100 ÷ 5 = 20\n片側の本数 : 20 + 1 = 21 本\n両側 : 21 × 2 = 42 本`,
      tip:`先に2倍してから＋1をすると41本となり誤り。片側を完成させてから2倍する、という順序を守る。` },

    { id:"ue4", cat:"ueki", d:2,
      q:`21本の木を一直線に等間隔で植えたところ、両端の木の間は120mだった。木と木の間隔は何mか。`,
      c:["6m","6.3m","7m","8m","12m"],
      a:0,
      e:`逆算の型。木が21本あり両端に植えられているので、間隔の数は 21−1＝20 になる。全長120mがこの20区間に等しく割り振られているので、120を20で割れば1区間ぶんの長さが出る。`,
      calc:`間隔の数 : 21 − 1 = 20\n120 ÷ 20 = 6 m`,
      tip:`120÷21≒5.7 としないこと。割る対象は本数ではなく間隔の数。ここでも「本数＝間隔＋1」の関係がそのまま使える。` },

    { id:"ue5", cat:"ueki", d:2,
      q:`長さ25cmのテープ8本を、のりしろ3cmずつ重ねて1本につなぐ。全体の長さは何cmか。`,
      c:["176cm","179cm","182cm","197cm","200cm"],
      a:1,
      e:`つなぎ目の問題も植木算と同じ構造。テープ8本の単純な合計は200cmだが、つなぎ目は本数より1少ない7か所あり、そこで3cmずつ重なって短くなる。`,
      calc:`単純な合計 : 25 × 8 = 200 cm\nつなぎ目 : 8 − 1 = 7 か所\n重なり : 7 × 3 = 21 cm\n200 − 21 = 179 cm`,
      tip:`つなぎ目の数＝本数−1。輪になるようにつなぐ場合は、つなぎ目が本数と同じ8か所になる（円形の植木算と同じ考え方）。` },

    /* ── 鶴亀算 ───────────────────────────── */
    { id:"tk1", cat:"tsurukame", d:1,
      q:`ツルとカメが合わせて20匹いて、足の数の合計は56本である。カメは何匹いるか。`,
      c:["6匹","7匹","8匹","9匹","12匹"],
      a:2,
      e:`鶴亀算は「全部が片方だったら」と仮定するのが定石。20匹すべてツルなら足は 2×20＝40本。実際は56本で16本多い。ツル1匹をカメに置きかえるごとに足は2本増えるので、16÷2＝8匹がカメ。`,
      calc:`全部ツルと仮定 : 2 × 20 = 40 本\n差 : 56 − 40 = 16 本\n1匹あたりの差 : 4 − 2 = 2 本\n16 ÷ 2 = 8 匹`,
      tip:`全部カメと仮定してもよい。4×20＝80本で24本多すぎるので 24÷2＝12匹がツル、カメは 20−12＝8匹と同じ答えになる。` },

    { id:"tk2", cat:"tsurukame", d:2,
      q:`1個80円のみかんと1個120円のりんごを合わせて15個買ったところ、代金は1,480円だった。りんごは何個買ったか。`,
      c:["7個","8個","9個","10個","12個"],
      a:0,
      e:`品物の個数と代金の問題も、鶴亀算とまったく同じ型。全部みかんなら 80×15＝1,200円。実際は1,480円で280円多い。みかん1個をりんごに替えるごとに40円増えるので、280÷40＝7個がりんご。`,
      calc:`全部みかんと仮定 : 80 × 15 = 1,200 円\n差 : 1,480 − 1,200 = 280 円\n1個あたりの差 : 120 − 80 = 40 円\n280 ÷ 40 = 7 個`,
      tip:`割って出た答えは「置きかえた個数」、つまり高いほうの個数。安いほうを聞かれていたら全体から引く（みかんは8個）。` },

    { id:"tk3", cat:"tsurukame", d:2,
      q:`10円硬貨と50円硬貨が合わせて24枚あり、合計金額は800円である。50円硬貨は何枚あるか。`,
      c:["8枚","10枚","12枚","14枚","16枚"],
      a:3,
      e:`全部10円と仮定すると 10×24＝240円。実際は800円で560円多く、1枚を50円に置きかえるごとに40円増えるので、560÷40＝14枚が50円硬貨。`,
      calc:`全部10円と仮定 : 10 × 24 = 240 円\n差 : 800 − 240 = 560 円\n1枚あたりの差 : 50 − 10 = 40 円\n560 ÷ 40 = 14 枚`,
      tip:`検算する癖をつける。50円×14＝700円、10円×10＝100円で合計800円、枚数も24枚で条件に合う。` },

    { id:"tk4", cat:"tsurukame", d:3,
      q:`1問正解すると5点もらえ、不正解だと2点減点されるテストがある。20問すべてに解答して58点だった。正解したのは何問か。`,
      c:["8問","10問","12問","13問","14問"],
      a:4,
      e:`得点の鶴亀算。全問正解なら 5×20＝100点。実際は58点で42点低い。1問まちがえると、もらえるはずの5点が入らないうえに2点引かれるので、1問につき7点下がる。42÷7＝6問が不正解で、正解はその残り。`,
      calc:`全問正解と仮定 : 5 × 20 = 100 点\n差 : 100 − 58 = 42 点\n1問あたりの差 : 5 + 2 = 7 点\n42 ÷ 7 = 6 問（不正解）\n20 − 6 = 14 問（正解）\n[検算] 14×5 − 6×2 = 70 − 12 = 58 ✓`,
      tip:`1問あたりの差を5点や2点としないこと。減点方式では「得られない点＋引かれる点」が1問あたりの差になる。ここが最大の落とし穴。` },

    { id:"tk5", cat:"tsurukame", d:2,
      q:`大人1人500円、子ども1人300円の入場料の施設に、合わせて30人が入場し、合計金額は12,200円だった。大人は何人か。`,
      c:["14人","16人","18人","20人","24人"],
      a:1,
      e:`全員子どもと仮定すると 300×30＝9,000円。実際は12,200円で3,200円多い。子ども1人を大人に替えるごとに200円増えるので、3,200÷200＝16人が大人。`,
      calc:`全員子どもと仮定 : 300 × 30 = 9,000 円\n差 : 12,200 − 9,000 = 3,200 円\n1人あたりの差 : 500 − 300 = 200 円\n3,200 ÷ 200 = 16 人`,
      tip:`大人16人・子ども14人で 8,000＋4,200＝12,200円と検算できる。人数の合計が30人になることも必ず確かめる。` },

    /* ── n進法 ────────────────────────────── */
    { id:"ns1", cat:"nshin", d:1,
      q:`2進法の 1011 を10進法で表すといくつか。`,
      c:["9","11","13","15","23"],
      a:1,
      e:`n進法は「桁の重み」を掛けて足すと10進法に直せる。2進法の重みは右から 1、2、4、8 と2倍ずつ増える。1011 なら、8の位・2の位・1の位に1が立っている。`,
      calc:`1 0 1 1\n8 4 2 1 ← 桁の重み\n1×8 + 0×4 + 1×2 + 1×1 = 11`,
      tip:`2進法の重みは 1, 2, 4, 8, 16, 32, 64, 128 まで覚えておくと速い。桁数が増えても手順はまったく同じ。` },

    { id:"ns2", cat:"nshin", d:2,
      q:`10進法の 25 を2進法で表すとどうなるか。`,
      c:["10011","10101","11001","11010","11100"],
      a:2,
      e:`10進法から2進法へは2つの方法がある。ひとつは2で割った余りを下から並べる方法、もうひとつは大きい重みから引いていく方法。25なら16が取れて残り9、次に8が取れて残り1、最後に1。使った位を1、使わない位を0にする。`,
      calc:`25 − 16 = 9 → 16の位は 1\n 9 −  8 = 1 → 8の位は 1\n 1 −  4 は引けない → 4の位は 0\n 1 −  2 は引けない → 2の位は 0\n 1 −  1 = 0 → 1の位は 1\n→ 11001`,
      tip:`検算は2進法から10進法へ戻して確かめる。11001＝16+8+1＝25 で一致する。この往復ができれば n進法は落とさない。` },

    { id:"ns3", cat:"nshin", d:2,
      q:`2進法の 1101 と 110 の和を、2進法で表すとどうなるか。`,
      c:["10011","10101","11001","11011","11101"],
      a:0,
      e:`2進法のまま筆算すると繰り上がりで間違えやすいので、いったん10進法に直すのが確実。1101は13、110は6で、和は19。19を2進法に戻すと 16+2+1 なので10011。`,
      calc:`1101 → 8+4+1 = 13\n 110 → 4+2　 = 6\n13 + 6 = 19\n19 = 16 + 2 + 1 → 10011`,
      tip:`2進法の足し算は 1+1＝10（0を書いて1繰り上がり）。慣れれば直接足せるが、試験では10進法を経由するほうが安全で速い。` },

    { id:"ns4", cat:"nshin", d:2,
      q:`3進法の 210 を10進法で表すといくつか。`,
      c:["12","15","18","21","27"],
      a:3,
      e:`2進法と手順はまったく同じで、重みが3倍ずつになるだけ。3進法の重みは右から 1、3、9、27。210 なら9の位が2、3の位が1、1の位が0。`,
      calc:`2 1 0\n9 3 1 ← 桁の重み\n2×9 + 1×3 + 0×1 = 18 + 3 = 21`,
      tip:`n進法では、各桁に入る数字は0からn−1まで。3進法の表記に3や4が出てきたら、その表記自体が誤りだと判断できる。` },

    { id:"ns5", cat:"nshin", d:2,
      q:`10進法の 100 を5進法で表すとどうなるか。`,
      c:["130","220","301","340","400"],
      a:4,
      e:`5進法の重みは右から 1、5、25。100は25でちょうど4回割り切れるので、25の位が4、5の位と1の位はどちらも0になる。`,
      calc:`100 ÷ 25 = 4 あまり 0\n 0 ÷  5 = 0 あまり 0\n→ 4×25 + 0×5 + 0×1 = 400\n[検算] 4×25 = 100 ✓`,
      tip:`0の桁を書き忘れて「4」としないよう、桁数を意識する。5進法の3桁は25の位・5の位・1の位で、最大 444＝124 まで表せる。` }
  ];

  const KEYS = ["A", "B", "C", "D", "E"];
  const DIFF = { 1: "易", 2: "中", 3: "難" };

  function diffHTML(d) {
    return '<span class="dtag d' + d + '"><span class="lv"><i></i><i></i><i></i></span>' +
      DIFF[d] + "</span>";
  }

  /* ══ 保存データ ════════════════════════════════════ */
  const STORE = "spi-nonverbal-v1";
  const HIST_MAX = 3;
  let storageOK = true;
  try {
    localStorage.setItem(STORE + "-probe", "1");
    localStorage.removeItem(STORE + "-probe");
  } catch (err) { storageOK = false; }

  let rec = { stats: {}, wrong: [], hist: {} };
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === "object") {
        rec.stats = p.stats || {};
        rec.wrong = Array.isArray(p.wrong) ? p.wrong : [];
        rec.hist = (p.hist && typeof p.hist === "object") ? p.hist : {};
      }
    }
  } catch (err) { /* 保存が使えない環境ではその場だけの記録になる */ }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(rec)); } catch (err) {}
  }

  /* 直近 HIST_MAX 回の正否。o=正解 / x=まちがい / u=わからない */
  function pushHist(id, mark) {
    const h = rec.hist[id] || (rec.hist[id] = []);
    h.push(mark);
    while (h.length > HIST_MAX) h.shift();
  }

  function histHTML(id) {
    const h = rec.hist[id] || [];
    if (!h.length) return "";
    const slots = Array(HIST_MAX - h.length).fill("none").concat(h);
    return '<span class="hist"><span class="hist-label">直近' + HIST_MAX + '回</span>' +
      slots.map(m => '<i class="' + m + '"></i>').join("") + "</span>";
  }

  /* ══ 状態 ══════════════════════════════════════════ */
  const UNKNOWN = -1;   // 「わからない」
  const TIMEUP  = -2;   // 時間切れ（本番モード）

  let selectedCats = new Set(CATS.map(c => c[0]));
  let quizLen = 10;
  let mode = "practice";     // "practice" | "exam"
  let limitSec = 75;
  let list = [];
  let idx = 0;
  let picked = null;
  let answered = false;
  let session = [];
  let reviewMode = false;    // 復習セッション（正答率に加算しない）
  let qStart = 0;
  let sessionStart = 0;
  let ticker = null;

  /* ══ DOM ═══════════════════════════════════════════ */
  const $ = id => document.getElementById(id);
  const screens = { home: $("screen-home"), quiz: $("screen-quiz"), result: $("screen-result") };
  const dock = $("dock"), dockInner = $("dock-inner");

  function show(name) {
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
    window.scrollTo(0, 0);
  }

  /* ══ 確認シート ════════════════════════════════════ */
  const sheet = $("sheet");
  let sheetOpts = null;
  let sheetOpener = null;

  function ask(opts) {
    sheetOpts = opts;
    sheetOpener = document.activeElement;
    $("sheet-title").textContent = opts.title;
    $("sheet-msg").textContent = opts.msg;
    const ok = $("sheet-ok");
    ok.textContent = opts.ok;
    ok.className = "btn" + (opts.danger ? " danger" : "");
    sheet.classList.remove("hidden");
    ok.focus();
  }

  function closeSheet(cancelled) {
    const opts = sheetOpts;
    sheet.classList.add("hidden");
    sheetOpts = null;
    if (sheetOpener && sheetOpener.focus) sheetOpener.focus();
    sheetOpener = null;
    if (cancelled && opts && opts.onCancel) opts.onCancel();
  }

  $("sheet-ok").addEventListener("click", () => {
    const run = sheetOpts && sheetOpts.onYes;
    closeSheet(false);
    if (run) run();
  });
  $("sheet-cancel").addEventListener("click", () => closeSheet(true));
  $("sheet-back").addEventListener("click", () => closeSheet(true));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !sheet.classList.contains("hidden")) closeSheet(true);
  });

  /* ══ テーマ切り替え ════════════════════════════════ */
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const now = root.getAttribute("data-theme");
    const dark = now ? now === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  /* ══ ホーム ════════════════════════════════════════ */
  function countFor(cat) { return Q.filter(q => q.cat === cat).length; }

  function renderChips() {
    const wrap = $("cat-chips");
    wrap.innerHTML = "";
    CATS.forEach(([key, label]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", selectedCats.has(key));
      b.innerHTML = label + ' <span class="n">' + countFor(key) + "</span>";
      b.addEventListener("click", () => {
        if (selectedCats.has(key)) selectedCats.delete(key); else selectedCats.add(key);
        b.setAttribute("aria-pressed", selectedCats.has(key));
        updateHomeDock();
      });
      wrap.appendChild(b);
    });
  }

  $("cat-all").addEventListener("click", () => {
    selectedCats = new Set(CATS.map(c => c[0]));
    renderChips(); updateHomeDock();
  });
  $("cat-none").addEventListener("click", () => {
    selectedCats = new Set();
    renderChips(); updateHomeDock();
  });

  $("mode-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]");
    if (!b) return;
    mode = b.dataset.mode;
    [...$("mode-seg").children].forEach(c => c.setAttribute("aria-pressed", c === b));
    $("limit-block").classList.toggle("hidden", mode !== "exam");
    $("mode-note").textContent = mode === "exam"
      ? "1問ごとに制限時間があり、時間切れは自動で次へ進みます。解説は最後にまとめて確認します。"
      : "時間制限なし。1問ごとに答え合わせと解説が出ます。";
    updateHomeDock();
  });

  $("limit-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-sec]");
    if (!b) return;
    limitSec = Number(b.dataset.sec);
    [...$("limit-seg").children].forEach(c => c.setAttribute("aria-pressed", c === b));
  });

  $("len-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-len]");
    if (!b) return;
    quizLen = Number(b.dataset.len);
    [...$("len-seg").children].forEach(c => c.setAttribute("aria-pressed", c === b));
    updateHomeDock();
  });

  function pool() { return Q.filter(q => selectedCats.has(q.cat)); }

  function renderRecord() {
    let tot = 0, cor = 0;
    CATS.forEach(([key]) => {
      const s = rec.stats[key];
      if (s) { tot += s.total; cor += s.correct; }
    });
    $("rec-pct").textContent = tot ? Math.round(cor / tot * 100) + "%" : "—";
    $("rec-sub").textContent = tot ? cor + " / " + tot + " 問正解（累計）" : "まだ解答がありません";

    const rows = $("rec-rows");
    rows.innerHTML = "";
    CATS.forEach(([key, label]) => {
      const s = rec.stats[key];
      if (!s || !s.total) return;
      const p = Math.round(s.correct / s.total * 100);
      const row = document.createElement("div");
      row.className = "stat-row";
      const cls = p < 50 ? "low" : (p < 80 ? "mid" : "");
      row.innerHTML =
        '<span class="name">' + label + '</span>' +
        '<span class="meter"><span class="' + cls + '" style="width:' + p + '%"></span></span>' +
        '<span class="val">' + p + '% ' + s.correct + '/' + s.total + '</span>';
      rows.appendChild(row);
    });
    if (!rows.children.length) {
      rows.innerHTML = '<p class="lede" style="font-size:.85rem;margin:0">解いた分野がここに並びます。</p>';
    }
    if (!storageOK) {
      rows.insertAdjacentHTML("beforeend",
        '<p class="lede" style="font-size:.8rem;margin:.6rem 0 0;color:var(--na)">' +
        "このブラウザでは保存が使えないため、記録はこの画面を閉じるまでの一時的なものになります。</p>");
    }

    const bw = $("btn-wrong");
    const n = rec.wrong.length;
    bw.textContent = n ? "まちがえた問題だけ（" + n + "問）" : "まちがえた問題だけ";
    bw.disabled = n === 0;
    bw.style.opacity = n ? "1" : ".45";
  }

  $("btn-wrong").addEventListener("click", () => {
    const ids = new Set(rec.wrong);
    const l = Q.filter(q => ids.has(q.id));
    if (l.length) start(shuffle(l), true);
  });

  $("btn-reset").addEventListener("click", () => {
    ask({
      title: "学習記録を消去しますか",
      msg: "分野別の正答率、復習リスト、直近3回の正否をすべて消します。元に戻せません。",
      ok: "消去する",
      danger: true,
      onYes: () => {
        rec = { stats: {}, wrong: [], hist: {} };
        save();
        renderRecord();
      }
    });
  });

  function updateHomeDock() {
    const n = pool().length;
    const take = quizLen === 0 ? n : Math.min(quizLen, n);
    const btn = dockInner.querySelector(".btn");
    if (!btn) return;
    btn.disabled = n === 0;
    btn.textContent = n === 0
      ? "分野を1つ以上選んでください"
      : (mode === "exam" ? "本番モードで" + take + "問" : take + "問を始める");
    $("m-count").textContent = "全" + Q.length + "問";
  }

  function homeDock() {
    dockInner.innerHTML = "";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.addEventListener("click", () => {
      const p = shuffle(pool());
      const take = quizLen === 0 ? p.length : Math.min(quizLen, p.length);
      if (take) start(p.slice(0, take), false);
    });
    dockInner.appendChild(b);
    dock.classList.remove("hidden");
    updateHomeDock();
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ══ 演習 ══════════════════════════════════════════ */
  function fmt(ms) {
    const t = Math.max(0, Math.round(ms / 1000));
    return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  }

  function stopTimer() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }

  function startTimer() {
    stopTimer();
    if (mode !== "exam") return;
    tick();
    ticker = setInterval(tick, 200);
  }

  function tick() {
    const left = limitSec * 1000 - (Date.now() - qStart);
    const clock = $("m-clock"), fill = $("timer-fill");
    const sec = Math.max(0, Math.ceil(left / 1000));
    clock.textContent = "残り " + sec + "秒";
    clock.className = "clock" + (sec <= 5 ? " crit" : sec <= 15 ? " warn" : "");
    fill.style.width = Math.max(0, left / (limitSec * 1000) * 100) + "%";
    fill.className = sec <= 5 ? "crit" : sec <= 15 ? "warn" : "";
    if (left <= 0) { stopTimer(); commit(TIMEUP); }
  }

  function start(l, isReview) {
    list = l; idx = 0; session = [];
    reviewMode = !!isReview;
    sessionStart = Date.now();
    show("quiz");
    renderQ();
  }

  function renderQ() {
    const q = list[idx];
    picked = null; answered = false;

    $("q-tag").textContent = CAT_NAME[q.cat];
    $("q-diff").innerHTML = diffHTML(q.d);
    $("q-text").innerHTML = q.q;
    $("q-table").innerHTML = q.table || "";
    $("q-verdict").innerHTML = "";
    $("pad").value = "";
    document.querySelector("details.memo").open = false;

    const box = $("q-choices");
    box.innerHTML = "";

    function makeChoice(val, key, text, extraClass) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice" + (extraClass ? " " + extraClass : "");
      b.dataset.val = val;
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="key">' + key + "</span><span>" + text + "</span>";
      b.addEventListener("click", () => {
        if (answered) return;
        picked = val;
        [...box.children].forEach(c => c.setAttribute("aria-pressed", Number(c.dataset.val) === val));
        quizDock();
      });
      box.appendChild(b);
    }

    q.c.forEach((text, i) => makeChoice(i, KEYS[i], text));
    makeChoice(UNKNOWN, "?", "わからない", "unknown");

    $("m-count").textContent = (idx + 1) + " / " + list.length;
    $("m-review").classList.toggle("hidden", !reviewMode);
    const sc = $("m-score");
    if (mode === "exam") {
      sc.classList.add("hidden");
      $("m-clock").classList.remove("hidden");
      $("timer").classList.remove("hidden");
    } else {
      sc.classList.toggle("hidden", session.length === 0);
      sc.innerHTML = "正解 <b>" + session.filter(s => s.ok).length + "</b>";
      $("m-clock").classList.add("hidden");
      $("timer").classList.add("hidden");
    }
    $("rule-fill").style.width = (idx / list.length * 100) + "%";

    qStart = Date.now();
    startTimer();
    quizDock();
    window.scrollTo(0, 0);
  }

  function quizDock() {
    dockInner.innerHTML = "";
    const quit = document.createElement("button");
    quit.type = "button";
    quit.className = "btn ghost";
    quit.textContent = "中断";
    quit.addEventListener("click", () => {
      // 確認中はタイマーを止め、取り消したら残り時間から再開する
      const left = limitSec * 1000 - (Date.now() - qStart);
      stopTimer();
      ask({
        title: "演習を中断しますか",
        msg: "ここまでの解答は記録に残ります。解答前のこの問題は記録されません。",
        ok: "中断してホームへ",
        onYes: toHome,
        onCancel: () => {
          if (mode === "exam" && !answered) {
            qStart = Date.now() - (limitSec * 1000 - left);
            startTimer();
          }
        }
      });
    });

    const main = document.createElement("button");
    main.type = "button";
    main.className = "btn";
    if (!answered) {
      const last = idx + 1 === list.length;
      main.textContent = mode === "exam" ? (last ? "解答して結果へ" : "解答して次へ") : "解答する";
      main.disabled = picked === null;
      main.addEventListener("click", () => commit(picked));
    } else {
      main.textContent = idx + 1 < list.length ? "次の問題へ" : "結果を見る";
      main.addEventListener("click", next);
    }
    dockInner.appendChild(quit);
    dockInner.appendChild(main);
  }

  function next() {
    if (idx + 1 < list.length) { idx++; renderQ(); } else { finish(); }
  }

  /* val: 0〜4 = 選択肢 / UNKNOWN = わからない / TIMEUP = 時間切れ */
  function commit(val) {
    if (answered) return;
    const q = list[idx];
    answered = true;
    stopTimer();
    const ok = val === q.a;
    const ms = Date.now() - qStart;

    // 解き直し（復習セッション）は累計の正答率に加算しない
    if (!reviewMode) {
      const s = rec.stats[q.cat] || (rec.stats[q.cat] = { correct: 0, total: 0 });
      s.total++;
      if (ok) s.correct++;
    }
    if (ok) {
      rec.wrong = rec.wrong.filter(id => id !== q.id);
    } else if (!rec.wrong.includes(q.id)) {
      rec.wrong.push(q.id);
    }
    // 直近の正否は練習モードでのみ記録する
    if (mode === "practice") {
      pushHist(q.id, ok ? "o" : val === UNKNOWN ? "u" : "x");
    }
    save();

    session.push({ q: q, ok: ok, picked: val, ms: ms });
    $("rule-fill").style.width = ((idx + 1) / list.length * 100) + "%";

    if (mode === "exam") { next(); return; }
    showVerdict(q, val, ok);

    const sc = $("m-score");
    sc.classList.remove("hidden");
    sc.innerHTML = "正解 <b>" + session.filter(x => x.ok).length + "</b>";
    quizDock();
  }

  /* 解説は「考え方 → 計算 → ここに注意」の3段で組む */
  function expHTML(q) {
    return '<div class="exp-body">' +
      '<span class="exp-label">考え方</span><p>' + q.e + "</p>" +
      (q.calc ? '<span class="exp-label">計算</span><div class="calc">' + q.calc + "</div>" : "") +
      (q.tip ? '<div class="tip"><span class="tip-label">ここに注意</span><p>' + q.tip + "</p></div>" : "") +
      "</div>";
  }

  function showVerdict(q, val, ok) {
    const box = $("q-choices");
    [...box.children].forEach(c => {
      const v = Number(c.dataset.val);
      c.disabled = true;
      c.setAttribute("aria-pressed", "false");
      if (v === q.a) {
        c.classList.add("is-ok");
        c.insertAdjacentHTML("beforeend", '<span class="mark">✓</span>');
      } else if (v === val && val === UNKNOWN) {
        c.classList.add("is-na");
        c.insertAdjacentHTML("beforeend", '<span class="mark">—</span>');
      } else if (v === val) {
        c.classList.add("is-ng");
        c.insertAdjacentHTML("beforeend", '<span class="mark">✕</span>');
      }
    });

    const head = ok ? "✓ 正解"
      : val === UNKNOWN ? "— わからない　正解は " + KEYS[q.a]
      : "✕ 不正解　正解は " + KEYS[q.a];
    const v = document.createElement("div");
    v.className = "verdict " + (ok ? "ok" : val === UNKNOWN ? "na" : "ng");
    v.innerHTML =
      '<div class="verdict-head">' + head + histHTML(q.id) + "</div>" +
      '<div class="verdict-body">' + expHTML(q) + "</div>";
    $("q-verdict").appendChild(v);
    v.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ══ 結果 ══════════════════════════════════════════ */
  function finish() {
    stopTimer();
    $("m-clock").classList.add("hidden");
    $("timer").classList.add("hidden");

    const n = session.length;
    const cor = session.filter(s => s.ok).length;
    const unk = session.filter(s => s.picked === UNKNOWN).length;
    const tmo = session.filter(s => s.picked === TIMEUP).length;
    const wrongPick = n - cor - unk - tmo;
    const p = Math.round(cor / n * 100);
    const total = Date.now() - sessionStart;
    const avg = session.reduce((a, s) => a + s.ms, 0) / n;

    $("res-score").innerHTML = cor + '<small> / ' + n + " 問正解</small>";
    $("res-comment").textContent =
      unk >= n / 2   ? "まだ手が出ない問題が多い状態です。「わからない」を選んだ分野の解説から埋めていきましょう。" :
      p === 100      ? "全問正解。この分野はもう仕上がっています。" :
      p >= 80 && unk ? "解ける型は安定しています。あとは「わからない」で飛ばした型を潰すだけです。" :
      p >= 80        ? "安定して解けています。まちがえた型だけ押さえ直しましょう。" :
      p >= 60        ? "解法は入っています。取りこぼした分野を重点的に。" :
      p >= 40        ? "解き方の型がまだ定着していません。解説の式を追い直しましょう。" :
                       "まずは1分野ずつ。解説の計算を書き写すところから始めましょう。";

    const note = $("res-note");
    note.classList.toggle("hidden", !reviewMode);
    if (reviewMode) {
      note.textContent = "解き直しのため、この結果は学習記録の正答率には加算していません。"
        + (mode === "practice" ? "正解した問題は復習リストから外れ、直近の正否には記録されます。"
                               : "正解した問題は復習リストから外れます。");
    }

    const cells = [
      ["正解", cor, "ok"],
      ["まちがい", wrongPick, "ng"],
      ["わからない", unk, "na"],
      [mode === "exam" ? "時間切れ" : "所要時間", mode === "exam" ? tmo : null, ""]
    ];
    $("res-tally").innerHTML = cells.map(([label, val, cls]) =>
      '<div><span class="t-label">' + label + '</span><span class="t-val ' + cls + '">' +
      (val === null ? fmt(total) : val + '<small> 問</small>') + "</span></div>"
    ).join("") +
      '<div style="grid-column:1/-1"><span class="t-label">' +
      (mode === "exam" ? "所要時間 / 1問平均" : "1問あたりの平均") + '</span><span class="t-val">' +
      (mode === "exam" ? fmt(total) + ' <small>/ ' + Math.round(avg / 1000) + '秒</small>'
                       : Math.round(avg / 1000) + '<small> 秒</small>') + "</span></div>";

    const byCat = {};
    session.forEach(s => {
      const b = byCat[s.q.cat] || (byCat[s.q.cat] = { c: 0, t: 0 });
      b.t++; if (s.ok) b.c++;
    });
    const cw = $("res-cats");
    cw.innerHTML = "";
    CATS.forEach(([key, label]) => {
      const b = byCat[key];
      if (!b) return;
      const pc = Math.round(b.c / b.t * 100);
      const cls = pc < 50 ? "low" : (pc < 80 ? "mid" : "");
      const row = document.createElement("div");
      row.className = "stat-row";
      row.innerHTML =
        '<span class="name">' + label + "</span>" +
        '<span class="meter"><span class="' + cls + '" style="width:' + pc + '%"></span></span>' +
        '<span class="val">' + b.c + "/" + b.t + "</span>";
      cw.appendChild(row);
    });

    const wrongs = session.filter(s => !s.ok);
    // 本番モードは解説を出していないので全問、練習モードはまちがえた問題だけ振り返る
    const shown = mode === "exam" ? session : wrongs;
    $("res-review-label").textContent = mode === "exam" ? "全問の解説" : "まちがえた問題";
    $("res-review-block").classList.toggle("hidden", shown.length === 0);
    const rw = $("res-review");
    rw.innerHTML = "";
    shown.forEach(s => {
      const d = document.createElement("div");
      d.className = "review-item";
      const plain = s.q.q.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      const badge = s.ok ? '<span class="badge ok">✓</span>'
        : s.picked === UNKNOWN || s.picked === TIMEUP ? '<span class="badge na">—</span>'
        : '<span class="badge ng">✕</span>';
      const mine = s.picked === UNKNOWN ? "<em>わからない</em>"
        : s.picked === TIMEUP ? "<em>時間切れ</em>"
        : KEYS[s.picked] + ". " + s.q.c[s.picked];
      d.innerHTML =
        badge + '<span class="qtag" style="margin:0">' + CAT_NAME[s.q.cat] + "</span>" +
        diffHTML(s.q.d) +
        '<p class="rq">' + (plain.length > 70 ? plain.slice(0, 70) + "…" : plain) + "</p>" +
        '<p class="ra">あなたの解答：' + mine + "　／　正解：<b>" +
          KEYS[s.q.a] + ". " + s.q.c[s.q.a] + "</b></p>" +
        (mode === "practice" ? histHTML(s.q.id) : "") +
        (mode === "exam" ? "<details><summary>解説</summary>" + expHTML(s.q) + "</details>" : "");
      rw.appendChild(d);
    });

    $("m-count").textContent = "結果";
    $("m-score").classList.add("hidden");
    $("rule-fill").style.width = "100%";

    dockInner.innerHTML = "";
    const again = document.createElement("button");
    again.type = "button";
    again.className = "btn";
    if (wrongs.length) {
      again.textContent = "まちがえた " + wrongs.length + " 問を解き直す";
      again.addEventListener("click", () => start(shuffle(wrongs.map(s => s.q)), true));
    } else {
      again.textContent = "もう一度おなじ設定で";
      again.addEventListener("click", () => {
        const p2 = shuffle(pool());
        const take = quizLen === 0 ? p2.length : Math.min(quizLen, p2.length);
        if (take) start(p2.slice(0, take), false);
      });
    }
    const home = document.createElement("button");
    home.type = "button";
    home.className = "btn ghost";
    home.textContent = "ホーム";
    home.addEventListener("click", toHome);

    dockInner.appendChild(home);
    dockInner.appendChild(again);
    show("result");
  }

  function toHome() {
    stopTimer();
    $("rule-fill").style.width = "0%";
    $("m-score").classList.add("hidden");
    $("m-clock").classList.add("hidden");
    $("m-review").classList.add("hidden");
    $("timer").classList.add("hidden");
    reviewMode = false;
    renderRecord();
    show("home");
    homeDock();
  }

  /* ══ 起動 ══════════════════════════════════════════ */
  $("home-eyebrow").textContent = "非言語 · " + CATS.length + "分野 · " + Q.length + "問";
  $("diff-legend").innerHTML = [1, 2, 3].map(d =>
    diffHTML(d) + '<span style="font-size:.78rem;color:var(--ink-3)">' +
    Q.filter(q => q.d === d).length + "問</span>").join("");
  renderChips();
  renderRecord();
  homeDock();
})();
</script>
